/* ==========================================================================
   COLAR / IMPORTAR resultado de outro sistema
   Formato desconhecido de propósito: lê linha a linha, tenta casar o nome do
   antimicrobiano e o valor de CIM, e sempre mostra uma prévia antes de aplicar.
   ========================================================================== */
const RE_CIM = /^[<>≤≥=]{0,2}\s*\d+(?:[.,]\d+)?(?:\s*\/\s*\d+(?:[.,]\d+)?)?$/;

/* Painel de CIM não chega perto disso: o maior corte de todo o programa é 64.
   Colando um relatório inteiro, porém, número de acesso, CEP e número de rua
   têm o mesmo formato de um CIM — "Av Colombo, 5790" virava um resultado
   aplicável, e um clique errado na prévia colocava 5790 num antibiótico. */
const CIM_MAX = 1024;

function ehValor(t){
  const s = String(t).replace(/\s+/g, "");
  if(!RE_CIM.test(s)) return false;
  const nums = s.match(/\d+(?:[.,]\d+)?/g) || [];
  return nums.every(function(n){ return parseFloat(n.replace(",", ".")) <= CIM_MAX; });
}
function normNome(t){
  return semAcento(String(t)).toLowerCase()
    .replace(/[^a-z0-9/ ]/g, " ").replace(/\s+/g, " ").trim();
}

/* Olho aberto: vai no laudo. Olho cortado: fica de fora. O ícone diz estado e
   ação ao mesmo tempo, sem texto competindo com o nome do antimicrobiano — e
   sem cor de alerta, que aqui significaria a coisa errada. */
const X_TIRAR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" '+
  'stroke-linecap="round" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"/>'+
  '<line x1="18" y1="6" x2="6" y2="18"/></svg>';

const OLHO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" '+
  'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+
  '<path d="M1.6 12S5.4 5.4 12 5.4 22.4 12 22.4 12 18.6 18.6 12 18.6 1.6 12 1.6 12Z"/>'+
  '<circle cx="12" cy="12" r="3.1"/></svg>';

const OLHO_CORTADO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" '+
  'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+
  '<path d="M9.9 5.6A9.6 9.6 0 0 1 12 5.4c6.6 0 10.4 6.6 10.4 6.6a19 19 0 0 1-2.7 3.7"/>'+
  '<path d="M6.3 6.8A18.9 18.9 0 0 0 1.6 12S5.4 18.6 12 18.6a9.9 9.9 0 0 0 4-.8"/>'+
  '<path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>'+
  '<line x1="3" y1="3" x2="21" y2="21"/></svg>';

/* Uma linha do texto colado -> {nome, valor}. Aceita tabulação, ";", "|",
   dois ou mais espaços, ou "Nome ≤4" numa coluna só. */
function partirLinha(linha){
  const l = String(linha).trim();
  if(!l) return null;
  let cels = l.split(/\t|;|\||\s{2,}/).map(function(x){ return x.trim(); })
              .filter(function(x){ return x !== ""; });
  if(cels.length === 1 && !ehValor(cels[0])){
    /* Coluna única: o separador pode ser um espaço simples. É assim que sai o
       PDF do equipamento quando alguém copia — "Amicacina <=4 S", com a
       interpretação dele no fim da linha. O valor é procurado no meio, não só
       no fim: exigindo fim de linha, "Amicacina <=4 S" virava um nome enorme
       com valor vazio, e ainda casava por prefixo com Amicacina — dizia que
       reconheceu e não trazia número nenhum.

       O que vem depois do CIM é a categoria da máquina, e é ignorado de
       propósito: quem interpreta aqui é o corte do laboratório. */
    const m = l.match(/^(.*?)\s+([<>≤≥=]{0,2}\s*\d+(?:[.,]\d+)?(?:\s*\/\s*\d+(?:[.,]\d+)?)?)(?:\s|$)/);
    if(m) cels = [m[1].trim(), m[2].trim()];
  }
  if(cels.length === 1) return ehValor(cels[0]) ? {nome:"", valor:cels[0].replace(/\s+/g,"")}
                                                : {nome:cels[0], valor:""};
  let valor = "";
  for(let i = 1; i < cels.length; i++){
    if(ehValor(cels[i])){ valor = cels[i].replace(/\s+/g, ""); break; }
  }
  return {nome:cels[0], valor:valor};
}

/* O mesmo antimicrobiano sai escrito de jeitos diferentes em cada sistema:
   separador da combinação (piperacilina-tazobactam / Piperacilina/Tazobactam),
   ordem dos componentes (sulfametoxazol-trimetoprima / Trimetoprima/
   Sulfametoxazol), terminação -a ou -o (ciprofloxacina / ciprofloxacino) e
   sinônimo do componente (clavulanato / ácido clavulânico). Tudo isso é a
   mesma droga e pode casar sozinho.

   A via NÃO entra na chave, de propósito. Oral e intravenoso têm cortes
   diferentes, e o equipamento manda "Cefuroxima" sem dizer qual. Tirando a via
   da chave, as duas linhas viram candidatas empatadas — e empate aqui devolve
   null, que joga a decisão para a pessoa na prévia. Escolher sozinho seria
   escolher um corte clínico no escuro. */
const SINONIMOS = {
  "acido clavulanico":"clavulanico", "clavulanato":"clavulanico",
  "ac clavulanico":"clavulanico", "clavulanico":"clavulanico",
  "smx":"sulfametoxazol", "tmp":"trimetoprima", "sxt":"sulfametoxazol"
};

function chaveNome(t){
  let s = semAcento(String(t)).toLowerCase();
  s = s.replace(/\([^)]*\)/g, " ");                              // "(f)", "(Infecção…)"
  s = s.replace(/\b(oral|intravenoso|intravenosa|endovenoso|iv|ev)\b/g, " ");
  s = s.replace(/[\/+\-]/g, "|");                                 // combinação
  s = s.replace(/[^a-z0-9| ]/g, " ");
  const partes = s.split("|").map(function(x){
    x = x.replace(/\s+/g, " ").trim();
    x = SINONIMOS[x] || x;
    return x.replace(/[ao]$/, "");                               // -ina / -ino
  }).filter(Boolean).sort();
  return partes.join("|");
}

/* Casa um nome vindo de fora com uma das linhas ainda livres. Ambíguo devolve
   null de propósito — quem escolhe é a pessoa, na prévia. */
function acharLinha(nomeFonte, livres){
  const q = normNome(nomeFonte);
  if(!q) return null;
  const ap = apelidos[q];
  if(ap){
    for(let i = 0; i < livres.length; i++) if(livres[i].n === ap) return livres[i];
  }
  const exatos = livres.filter(function(l){ return normNome(l.n) === q; });
  if(exatos.length === 1) return exatos[0];
  if(exatos.length > 1) return null;

  const k = chaveNome(nomeFonte);
  if(k){
    const porChave = livres.filter(function(l){ return chaveNome(l.n) === k; });
    if(porChave.length === 1) return porChave[0];
    if(porChave.length > 1) return null;   // empate: a via é decisão de quem lauda
  }

  const pre = livres.filter(function(l){
    const a = normNome(l.n);
    return a.indexOf(q) === 0 || q.indexOf(a) === 0;
  });
  return pre.length === 1 ? pre[0] : null;
}

/* CSV de verdade: campos entre aspas, com vírgula e quebra de linha dentro.
   O split por tabulação não dá conta — e o relatório do equipamento vem assim. */
function partirCSV(texto){
  const linhas = [];
  let campo = "", linha = [], aspas = false;
  const t = String(texto);
  for(let i = 0; i < t.length; i++){
    const c = t[i];
    if(aspas){
      if(c === '"'){ if(t[i+1] === '"'){ campo += '"'; i++; } else aspas = false; }
      else campo += c;
    }else if(c === '"'){ aspas = true; }
    else if(c === ","){ linha.push(campo); campo = ""; }
    else if(c === "\r"){ /* ignora */ }
    else if(c === "\n"){ linha.push(campo); linhas.push(linha); linha = []; campo = ""; }
    else campo += c;
  }
  if(campo !== "" || linha.length){ linha.push(campo); linhas.push(linha); }
  return linhas;
}

/* Vale a pena tratar como CSV? Só quando há vírgula separando campos de
   verdade em várias linhas — senão um texto qualquer com vírgulas viraria uma
   tabela de uma coluna e o caminho normal funcionaria melhor. */
function pareceCSV(texto){
  if(String(texto).indexOf(",") < 0) return false;
  const l = partirCSV(texto).filter(function(r){ return r.some(function(c){ return c.trim(); }); });
  if(l.length < 2) return false;
  const largas = l.filter(function(r){ return r.length >= 4; }).length;
  return largas >= Math.max(2, Math.floor(l.length * 0.6));
}

/* Uma linha do relatório do equipamento traz dezenas de campos: número da
   diluição, preço, marcadores de conflito, texto de assinatura. O nome do
   antimicrobiano aparece repetido e o CIM vem alguns campos depois dele.

   Procurar o nome primeiro e só então o valor é o que evita pegar lixo: o
   campo "1,00" perto do começo da linha tem cara de CIM e passaria em qualquer
   varredura que só procurasse o primeiro número. */
function lerLinhaCSV(campos, livres){
  const valorApos = function(i){
    for(let j = i + 1; j < campos.length; j++){
      const v = String(campos[j]).trim();
      if(!v) continue;
      if(ehValor(v)) return v.replace(/\s+/g, "");
      // categoria da máquina (S/I/R/X) não interrompe: o CIM pode vir depois
      if(/^[SIRX]$/i.test(v)) continue;
    }
    return "";
  };
  for(let i = 0; i < campos.length; i++){
    const nome = String(campos[i]).trim();
    if(!nome || ehValor(nome)) continue;
    const alvo = acharLinha(nome, livres);
    if(alvo) return {alvo:alvo, valor:valorApos(i), nome:nome};
    /* Nome conhecido mas empatado — Amoxicilina-clavulanato serve às três
       vias — tem que ir para a prévia e não sumir. acharLinha devolve null
       tanto para empate quanto para nome estranho; a chave separa os dois. */
    const k = chaveNome(nome);
    if(k && livres.some(function(l){ return chaveNome(l.n) === k; }))
      return {alvo:null, valor:valorApos(i), nome:nome};
  }
  return null;
}

function analisar(texto){
  const brutas = String(texto).split(/\r\n|\r|\n/)
    .map(function(x){ return x.trim(); }).filter(function(x){ return x !== ""; });
  const alvos = linhas().filter(function(l){ return l.tipo === "cim"; });
  if(!brutas.length) return {modo:"vazio", pares:[], sobras:[], alvos:alvos};

  /* Caminho do CSV do equipamento, antes do caminho linha-a-linha: as duas
     leituras dariam resultados diferentes para o mesmo texto, e a do CSV é a
     que entende as colunas. */
  if(pareceCSV(texto)){
    const linhasCSV = partirCSV(texto).filter(function(r){
      return r.some(function(c){ return String(c).trim(); });
    });
    const livresCSV = alvos.slice(), paresCSV = [], sobrasCSV = [];
    linhasCSV.forEach(function(campos){
      const r = lerLinhaCSV(campos, livresCSV);
      if(!r || !r.valor) return;
      if(r.alvo){
        livresCSV.splice(livresCSV.indexOf(r.alvo), 1);
        paresCSV.push({linha:r.alvo, valor:r.valor, fonte:r.nome+" · "+r.valor});
      }else{
        sobrasCSV.push({nome:r.nome, valor:r.valor, fonte:r.nome+" · "+r.valor});
      }
    });
    if(paresCSV.length || sobrasCSV.length)
      return {modo:"nome", pares:paresCSV, sobras:sobrasCSV, alvos:alvos, livres:livresCSV};
  }

  const lidas = brutas.map(partirLinha).filter(Boolean);
  const semNome = lidas.filter(function(p){ return !p.nome; }).length;

  // bloco só de valores -> aplica pela posição, como uma coluna de planilha
  if(semNome >= lidas.length * 0.7){
    const pares = [];
    for(let i = 0; i < lidas.length && i < alvos.length; i++){
      pares.push({linha:alvos[i], valor:lidas[i].valor || lidas[i].nome, fonte:brutas[i]});
    }
    return {modo:"posicao", pares:pares, sobras:[], alvos:alvos,
            ignoradas:Math.max(0, lidas.length - alvos.length)};
  }

  const livres = alvos.slice(), pares = [], sobras = [];
  lidas.forEach(function(p, i){
    if(!p.nome) return;
    const alvo = acharLinha(p.nome, livres);
    if(alvo){
      livres.splice(livres.indexOf(alvo), 1);
      pares.push({linha:alvo, valor:p.valor, fonte:brutas[i]});
    }else if(String(p.valor || "").trim()){
      sobras.push({nome:p.nome, valor:p.valor, fonte:brutas[i]});
    }
    /* Linha sem valor não tem o que aplicar. São os cabeçalhos que vêm junto
       na cópia — "Fármaco", "CIM/Conc SIR", o nome do microrganismo. Listá-las
       como não reconhecidas enche a prévia de ruído e faz o placar mentir. */
  });
  return {modo:"nome", pares:pares, sobras:sobras, alvos:alvos, livres:livres};
}

/* Exports do Windows costumam vir em windows-1252; UTF-8 primeiro, depois o resto. */
function lerArquivoTexto(file, cb){
  const fr = new FileReader();
  fr.onload = function(){
    let txt;
    try{ txt = new TextDecoder("utf-8", {fatal:true}).decode(fr.result); }
    catch(e){
      try{ txt = new TextDecoder("windows-1252").decode(fr.result); }
      catch(e2){ txt = new TextDecoder().decode(fr.result); }
    }
    cb(txt);
  };
  fr.onerror = function(){ toast("Não consegui ler o arquivo."); };
  fr.readAsArrayBuffer(file);
}

function aplicarImportacao(){
  const r = imp.res;
  if(!r) return;
  let n = 0, vazios = 0;
  r.pares.forEach(function(par){
    const v = trocarSimbolos(String(par.valor || "").trim(), 0)[0];
    if(!v){ vazios++; return; }                 // sem valor na origem: não apaga o que já está aqui
    setVal(orgAtual.id, par.linha.n, v);
    if(!pendentes[orgAtual.id]) pendentes[orgAtual.id] = {};
    pendentes[orgAtual.id][par.linha.n] = true;
    n++;
  });
  gravar(K_PEND, pendentes);
  imp = null;
  renderLaudo();
  toast(n + " valor" + (n === 1 ? "" : "es") + " aplicado" + (n === 1 ? "" : "s") +
        (vazios ? " · " + vazios + " sem resultado na origem, mantido" + (vazios === 1 ? "" : "s") : "") +
        " — confira antes de copiar.");
}

function painelImportHTML(){
  if(!imp) return "";
  if(imp.fase === "entrada"){
    return '<div class="imp"><header><h3>Colar ou importar resultado</h3>'+
      '<button class="btn ghost" id="impFechar">Fechar</button></header>'+
      '<div class="corpo">'+
        '<p class="nota">Cole o resultado do outro sistema — dá para abrir o PDF do equipamento, '+
        'selecionar tudo e colar aqui — ou escolha o arquivo direto '+
        '(<strong>.csv</strong> do equipamento, <strong>.txt</strong>, <strong>.tsv</strong>). '+
        'O CSV do equipamento entra como está, com todas as colunas de conflito e assinatura: '+
        'o programa acha o antimicrobiano e o CIM no meio delas. Se as linhas tiverem o nome do '+
        'antimicrobiano, ele casa pelo nome — a ordem não importa. Se for só uma coluna de valores, '+
        'aplica na ordem da tabela. A interpretação que vier junto é descartada: quem interpreta '+
        'é o corte daqui. Nada entra sem você ver a prévia.</p>'+
        '<textarea id="impTexto" spellcheck="false" placeholder="Amicacina&#9;&#8804;4&#10;Ampicilina&#9;&gt;8&#10;Cefepima&#9;&#8804;1"></textarea>'+
        '<div class="linhabtn">'+
          '<button class="btn primary" id="impLer">Ler</button>'+
          '<button class="btn" id="impArquivo">Escolher arquivo…</button>'+
        '</div>'+
      '</div></div>';
  }

  const r = imp.res;
  const usados = r.pares.filter(function(p){ return String(p.valor || "").trim(); }).length;
  let placar;
  if(r.modo === "posicao"){
    placar = '<span class="bom">'+usados+'</span> valor(es) na ordem da tabela'+
             (r.ignoradas ? ' · <span class="ruim">'+r.ignoradas+' a mais ignorado(s)</span>' : "");
  }else{
    placar = '<span class="bom">'+usados+'</span> de '+r.alvos.length+' linhas reconhecidas pelo nome'+
             (r.sobras.length ? ' · <span class="ruim">'+r.sobras.length+' não reconhecida(s)</span>' : "");
  }

  const corpo = r.pares.map(function(par, i){
    const v = trocarSimbolos(String(par.valor || "").trim(), 0)[0];
    const atual = val(orgAtual.id, par.linha.n);
    const cat = v ? interpretar(v, par.linha.ref) : null;
    return '<tr>'+
      '<td>'+esc(par.linha.n)+'</td>'+
      '<td class="vnovo">'+(v ? esc(v) : '<span style="color:var(--ink-3)">—</span>')+'</td>'+
      '<td>'+(atual && atual !== v ? '<span class="antes">'+esc(atual)+'</span>' : "")+'</td>'+
      '<td>'+(cat ? '<span class="tag '+cat.cls+'" style="padding:3px 8px;font-size:11.5px">'+esc(cat.txt)+'</span>' : "")+'</td>'+
    '</tr>';
  }).join("");

  const opcoes = (r.livres || []).map(function(l){
    return '<option value="'+esc(l.n)+'">'+esc(l.n)+'</option>';
  }).join("");
  const sobras = r.sobras.map(function(sb, i){
    return '<tr class="sobra">'+
      '<td class="vsrc">'+esc(sb.fonte.length > 60 ? sb.fonte.slice(0,60)+"…" : sb.fonte)+'</td>'+
      '<td colspan="3"><select data-sobra="'+i+'"><option value="">ignorar esta linha</option>'+opcoes+'</select></td>'+
    '</tr>';
  }).join("");

  return '<div class="imp"><header><h3>Prévia da importação</h3>'+
      '<span class="placar">'+placar+'</span>'+
      '<button class="btn ghost" id="impVoltar">Voltar</button></header>'+
    '<div class="corpo">'+
      (r.modo === "posicao"
        ? '<p class="nota">Nenhum nome de antimicrobiano no texto — os valores vão pela <strong>ordem da tabela</strong>. Confira linha a linha antes de aplicar.</p>'
        : "")+
      '<div class="cx"><table>'+corpo+sobras+'</table></div>'+
      (r.sobras.length
        ? '<p class="nota">Escolha a que linha cada não reconhecida corresponde — a associação fica gravada e da próxima vez ele já reconhece sozinho. '+
          'Colando um relatório inteiro, cabeçalho e endereço podem cair aqui: deixe em <strong>ignorar</strong>.</p>'
        : "")+
      '<div class="linhabtn">'+
        '<button class="btn primary" id="impAplicar">Aplicar '+usados+' valor(es)</button>'+
        '<button class="btn ghost" id="impCancelar">Cancelar</button>'+
      '</div>'+
      '<p class="nota">O que entrar fica marcado como <strong>não conferido</strong> até você passar o olho.</p>'+
    '</div></div>';
}

function ligarImport(){
  if(!imp) return;
  const fechar = function(){ imp = null; renderLaudo(); };

  if(imp.fase === "entrada"){
    $("impFechar").addEventListener("click", fechar);
    $("impLer").addEventListener("click", function(){
      const t = $("impTexto").value;
      if(!t.trim()){ toast("Cole o resultado ou escolha um arquivo."); return; }
      imp = {fase:"previa", res:analisar(t)};
      renderLaudo();
    });
    $("impArquivo").addEventListener("click", function(){
      const inp = document.createElement("input");
      inp.type = "file";
      inp.accept = ".txt,.csv,.tsv,.tab,.text,text/plain,text/csv";
      inp.addEventListener("change", function(){
        const f = inp.files && inp.files[0];
        if(!f) return;
        lerArquivoTexto(f, function(txt){
          imp = {fase:"previa", res:analisar(txt), arquivo:f.name};
          renderLaudo();
        });
      });
      inp.click();
    });
    const ta = $("impTexto");
    if(ta) ta.focus();
    return;
  }

  $("impVoltar").addEventListener("click", function(){ imp = {fase:"entrada"}; renderLaudo(); });
  $("impCancelar").addEventListener("click", fechar);
  $("impAplicar").addEventListener("click", aplicarImportacao);

  $("content").querySelectorAll("[data-sobra]").forEach(function(sel){
    sel.addEventListener("change", function(){
      const sb = imp.res.sobras[Number(sel.dataset.sobra)];
      if(!sel.value) return;
      const alvo = imp.res.livres.filter(function(l){ return l.n === sel.value; })[0];
      if(!alvo) return;
      apelidos[normNome(sb.nome)] = alvo.n;          // aprende o vocabulário do outro sistema
      gravar(K_ALIAS, apelidos);
      imp.res.livres.splice(imp.res.livres.indexOf(alvo), 1);
      imp.res.pares.push({linha:alvo, valor:sb.valor, fonte:sb.fonte});
      imp.res.sobras.splice(imp.res.sobras.indexOf(sb), 1);
      renderLaudo();
    });
  });
}

/* Observações do laudo, embaixo do quadro e não numa tela à parte: elas são
   parte do que se cola no laudo, então escolher e copiar tem que acontecer no
   mesmo lugar e na mesma ação. */
function painelObsHTML(){
  const L = listaObs();
  const sel = obsDaAmostra();
  const escolhidas = sel.map(function(cod){
    const o = acharObs(cod);
    const txt = o ? o.t : "(observação "+cod+" não existe mais na planilha)";
    return '<div class="obsitem'+(o?"":" perdida")+'">'+
      '<div class="obscod">'+esc(cod)+'</div>'+
      '<div class="obstxt">'+esc(txt)+'</div>'+
      '<button class="obstirar" data-obstirar="'+esc(cod)+'" title="Tirar esta observação do laudo" '+
      'aria-label="Tirar a observação '+esc(cod)+'">'+X_TIRAR+'</button>'+
    '</div>';
  }).join("");

  /* Escolher entre 68 observações numa lista suspensa é rolar às cegas: o
     código não diz o que a observação fala, e o texto é longo demais para
     caber numa linha de <option>. Campo com filtro deixa procurar pelo que se
     lembra — "sonda", "ESBL", "KPC" — ou pelo código, quando já se sabe qual é. */
  const disponiveis = L.filter(function(o){ return sel.indexOf(o.c) < 0; });
  const q = semAcento(buscaObs).toLowerCase().trim();
  const achados = !q ? [] : disponiveis.filter(function(o){
    return semAcento(o.c).toLowerCase().indexOf(q) >= 0 ||
           semAcento(o.t).toLowerCase().indexOf(q) >= 0;
  });

  function realce(t){
    if(!q) return esc(t);
    const partes = String(t).split(new RegExp("("+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig"));
    return partes.map(function(x, i){ return i % 2 ? "<mark>"+esc(x)+"</mark>" : esc(x); }).join("");
  }

  /* Mostra o pedaço em volta do que foi procurado, não o começo do texto. Uma
     observação longa quase nunca traz a palavra buscada nas primeiras linhas:
     o resultado aparecia sem o termo à vista e não dava para saber por que
     aquela linha casou. */
  function trecho(t){
    const limpo = String(t).replace(/\s+/g, " ");
    const i = q ? semAcento(limpo).toLowerCase().indexOf(q) : -1;
    if(i < 0) return {txt:limpo.slice(0,150), fim:limpo.length > 150};
    const ini = Math.max(0, i - 45);
    const corte = limpo.slice(ini, ini + 170);
    return {txt:(ini > 0 ? "…" : "") + corte, fim:(ini + 170) < limpo.length};
  }

  const MAX = 8;
  let lista;
  if(!q){
    /* Sem termo, a lista inteira fica a um clique. Buscar só serve para quem
       lembra alguma palavra; quem não lembra precisa poder folhear — e é o
       caso de quem usa isto poucas vezes por mês. As duas portas para a mesma
       lista, e não uma escolha entre elas. */
    lista = '<div class="obstodas">'+
      '<button class="btn obsver" id="obsVerTodas" aria-expanded="'+(verTodasObs?"true":"false")+'">'+
        (verTodasObs ? "Esconder a lista" : "Ver as "+disponiveis.length+" observações")+
      '</button>'+
      '<span class="obsdica">ou digite acima para achar pelo texto</span>'+
    '</div>'+
    (verTodasObs
      ? '<div class="obsachados obsrolagem">'+disponiveis.map(function(o){
          const resumo = o.t.replace(/\s+/g, " ");
          return '<button class="obsop" data-obspor="'+esc(o.c)+'">'+
                 '<span class="obscod">'+esc(o.c)+'</span>'+
                 '<span class="obsop-txt">'+esc(resumo.slice(0,150))+(resumo.length>150?"…":"")+'</span>'+
                 '</button>';
        }).join("")+'</div>'
      : "");
  }else if(!achados.length){
    lista = '<p class="obsdica">Nenhuma observação com “'+esc(buscaObs)+'”.</p>';
  }else{
    lista = '<div class="obsachados">'+achados.slice(0, MAX).map(function(o){
      const tr = trecho(o.t);
      return '<button class="obsop" data-obspor="'+esc(o.c)+'">'+
             '<span class="obscod">'+realce(o.c)+'</span>'+
             '<span class="obsop-txt">'+realce(tr.txt)+(tr.fim?"…":"")+'</span>'+
             '</button>';
    }).join("")+
    (achados.length > MAX
      ? '<p class="obsdica">e mais '+(achados.length-MAX)+' — escreva mais para afinar.</p>'
      : "")+'</div>';
  }

  return '<div class="panel obsbox">'+
    '<div class="refhead"><strong>Observações do laudo</strong>'+
    '<p>Vão coladas logo abaixo do quadro quando você clicar em <strong>Copiar tabela</strong>. '+
    'Valem só para esta amostra.</p></div>'+
    '<div class="obscorpo">'+
      (sel.length ? '<div class="obslista">'+escolhidas+'</div>'
                  : '<p class="obsvazio">Nenhuma observação escolhida — o laudo sai só com o quadro.</p>')+
      '<div class="obsadd">'+
        '<input id="obsBusca" class="search" spellcheck="false" autocomplete="off" '+
          'placeholder="Digite para achar uma observação — sonda, ESBL, KPC, Bac 12…" '+
          'aria-label="Procurar observação para o laudo" value="'+esc(buscaObs)+'">'+
        lista+
      '</div>'+
    '</div></div>';
}

function renderLaudo(){
  const L = linhas();
  const c = {sdp:0, sae:0, res:0, warn:0, vazio:0};
  let nPend = 0, nFora = 0;
  L.forEach(function(l){
    if(l.tipo === "tit") return;
    if(l.omitido) nFora++;
    if(l.pendente) nPend++;
    if(!l.cat) c.vazio++;
    else if(l.cat.cls === "sdp") c.sdp++;
    else if(l.cat.cls === "sae") c.sae++;
    else if(l.cat.cls === "res") c.res++;
    else c.warn++;
  });

  $("actions").innerHTML =
    '<button class="btn ghost" id="btnLimpar">Limpar tudo</button>'+
    '<button class="btn" id="btnImportar2">Colar / importar</button>'+
    '<button class="btn" id="btnNova">Nova amostra</button>'+
    '<button class="btn primary" id="btnCopiar">Copiar tabela</button>';

  let i = 0;
  const corpo = L.map(function(l){
    if(l.tipo === "tit") return '<tr class="sec"><td colspan="5">'+esc(l.n)+'</td></tr>';
    const idx = i++;
    const tag = l.cat
      ? '<span class="tag '+l.cat.cls+'">'+esc(l.cat.txt)+'</span>'
      : '<span class="tag empty">'+(l.tipo === "triagem" ? "aguardando triagem" : "aguardando CIM")+'</span>';

    const marca = l.pendente
      ? '<button class="pend" data-pend="'+esc(l.n)+'" title="Ainda não conferido nesta amostra. Clique para confirmar." aria-label="Confirmar '+esc(l.n)+'"></button>'
      : "";

    let campo, corte;
    if(l.tipo === "triagem"){
      campo = '<select class="tri mono'+(l.pendente?" pendente":"")+'" data-n="'+esc(l.n)+'" data-i="'+idx+'" aria-label="Triagem '+esc(l.n)+'">'+
              '<option value=""'+(l.v?"":" selected")+'>—</option>'+
              l.op.map(function(o){ return '<option'+(l.v===o?" selected":"")+'>'+esc(o)+'</option>'; }).join("")+
              '</select>';
      corte = '<span>triagem fenotípica</span>';
    }else{
      campo = '<input class="cim mono'+(l.pendente?" pendente":"")+'" data-n="'+esc(l.n)+'" data-i="'+idx+
              '" value="'+esc(l.v)+'" placeholder="—" spellcheck="false" autocomplete="off" aria-label="CIM de '+esc(l.n)+'">';
      const p = [];
      if(String(l.ref.sdp).trim()) p.push("<span><b>S</b> "+esc(l.ref.sdp)+"</span>");
      if(String(l.ref.sae).trim()) p.push("<span><b>I</b> "+esc(l.ref.sae)+"</span>");
      if(String(l.ref.res).trim()) p.push("<span><b>R</b> "+esc(l.ref.res)+"</span>");
      corte = p.length ? p.join("") : '<span class="none">sem corte cadastrado</span>';
    }
    /* Tirar do laudo é decisão de quem lauda, não do programa: em alguns casos
       o antimicrobiano não deve ser mostrado. A linha continua aqui, com o
       valor e a interpretação à vista — some só do que é copiado. Esconder da
       tela também deixaria a pessoa sem saber o que ela mesma tirou. */
    const btnOmitir = '<button class="omitir'+(l.omitido?" ativo":"")+'" data-omitir="'+esc(l.n)+'" '+
      'title="'+(l.omitido ? "Fora do laudo. Clique para mostrar de novo."
                           : "Clique para não mostrar este antimicrobiano no laudo desta amostra.")+'" '+
      'aria-pressed="'+(l.omitido?"true":"false")+'" '+
      'aria-label="'+(l.omitido?"Mostrar ":"Não mostrar ")+esc(l.n)+' no laudo">'+
      (l.omitido ? OLHO_CORTADO : OLHO)+'</button>';

    return '<tr'+(l.omitido?' class="omitida"':'')+'>'+
      '<td class="c-abx"><div class="abxrow"><span class="pendslot">'+marca+'</span>'+
      '<span class="abxnome">'+esc(l.n)+'</span></div></td>'+
      '<td class="c-cim">'+campo+'</td>'+
      '<td class="c-int">'+tag+'</td>'+
      '<td class="c-corte"><div class="corte mono">'+corte+'</div></td>'+
      '<td class="c-fim">'+btnOmitir+'</td>'+
    '</tr>';
  }).join("");

  /* Linha tirada do laudo é ausência: quem lê o laudo não tem como notar que
     faltou. O aviso fica na tela enquanto durar, para não copiar sem lembrar. */
  const avisoFora = nFora
    ? '<div class="avisofora"><span>'+nFora+(nFora===1
        ? ' antimicrobiano não vai no laudo desta amostra.'
        : ' antimicrobianos não vão no laudo desta amostra.')+
      '</span><button class="btn" id="btnVoltarTodos">Incluir todos de volta</button></div>'
    : "";

  const aviso = nPend
    ? '<div class="avisopend"><span>'+nPend+(nPend===1
        ? ' linha ainda não conferida nesta amostra.'
        : ' linhas ainda não conferidas nesta amostra.')+
      '</span><button class="btn" id="btnConferirTodas">Conferir todas</button></div>'
    : "";

  $("content").innerHTML = avisoFonteHTML() + painelImportHTML() + avisoFora + aviso +
    '<div class="summary">'+
      '<div class="sumcell sdp"><div class="k">Sensível, dose padrão</div><div class="v">'+c.sdp+'</div></div>'+
      '<div class="sumcell sae"><div class="k">Aumentando exposição</div><div class="v">'+c.sae+'</div></div>'+
      '<div class="sumcell res"><div class="k">Resistente</div><div class="v">'+c.res+'</div></div>'+
      '<div class="sumcell warn"><div class="k">Conferir resultado</div><div class="v">'+c.warn+'</div></div>'+
      '<div class="sumcell"><div class="k">Em branco</div><div class="v">'+c.vazio+'</div></div>'+
      (nPend ? '<div class="sumcell pendente"><div class="k">Não conferidas</div><div class="v">'+nPend+'</div></div>' : "")+
      (nFora ? '<div class="sumcell fora"><div class="k">Fora do laudo</div><div class="v">'+nFora+'</div></div>' : "")+
    '</div>'+
    '<div class="panel"><div class="tablewrap"><table class="grid">'+
      '<thead><tr><th>Antimicrobiano</th><th style="text-align:center">CIM (mg/L)</th>'+
      '<th>Interpretação</th><th>Corte aplicado</th><th></th></tr></thead>'+
      '<tbody>'+corpo+'</tbody></table></div></div>'+
    painelObsHTML()+
    /* Em parágrafo corrido isto virava um bloco estreito com um vazio enorme à
       direita: linha de texto tem limite de leitura, mas a tela é larga. Como
       são avisos independentes, e não uma explicação que se lê do começo ao
       fim, cada um vira um item e a grade preenche a largura. */
    '<div class="dicas">'+
      '<div><b>Valores</b>Aceita <code>≤0,25</code>, <code>&gt;8</code>, <code>16/2</code>, '+
        '<code>4</code>. Digitar <code>&lt;=</code> ou <code>&gt;=</code> vira '+
        '<code>≤</code> / <code>≥</code> sozinho.</div>'+
      '<div><b>Teclado</b><code>Enter</code> vai para o próximo campo, '+
        '<code>Shift+Enter</code> volta.</div>'+
      '<div><b>Colar</b>Várias linhas num campo só preenchem a coluna para baixo.</div>'+
      '<div><b>Corte aplicado</b>Mostra qual regra decidiu. Essa coluna não vai no copiar.</div>'+
      '<div><b>O olho no fim da linha</b>Decide se aquele antimicrobiano sai no laudo. '+
        'Cortado, fica fora do que você copia — mas continua aqui na tela.</div>'+
    '</div>';

  const bf = $("btnIrFonte");
  if(bf) bf.addEventListener("click", function(){ vista = "fonte"; imp = null; render(); });
  $("btnCopiar").addEventListener("click", copiar);
  $("btnNova").addEventListener("click", novaAmostra);
  $("btnLimpar").addEventListener("click", limpar);
  $("btnImportar2").addEventListener("click", function(){
    imp = imp ? null : {fase:"entrada"};
    renderLaudo();
  });
  ligarImport();
  const bt = $("btnConferirTodas");
  if(bt) bt.addEventListener("click", function(){
    pendentes[orgAtual.id] = {};
    gravar(K_PEND, pendentes);
    renderLaudo();
    toast("Todas as linhas conferidas.");
  });

  const btTodas = $("obsVerTodas");
  if(btTodas) btTodas.addEventListener("click", function(){
    verTodasObs = !verTodasObs;
    renderLaudo();
    const volta = $("obsVerTodas");
    if(volta) volta.focus();
  });
  const bo = $("obsBusca");
  if(bo){
    bo.addEventListener("input", function(){
      buscaObs = bo.value;
      renderLaudo();
    });
    /* Enter pega o primeiro achado: quem já sabe o que quer digita três letras
       e confirma, sem tirar a mão do teclado. */
    bo.addEventListener("keydown", function(e){
      if(e.key === "Escape"){ buscaObs = ""; renderLaudo(); return; }
      if(e.key !== "Enter") return;
      e.preventDefault();
      const primeiro = $("content").querySelector("[data-obspor]");
      if(primeiro) primeiro.click();
    });
    if(buscaObs){
      bo.focus();
      try{ bo.setSelectionRange(buscaObs.length, buscaObs.length); }catch(e){}
    }
  }
  $("content").querySelectorAll("[data-obspor]").forEach(function(b){
    b.addEventListener("click", function(){
      const atual = obsDaAmostra();
      const cod = b.dataset.obspor;
      if(atual.indexOf(cod) < 0){ atual.push(cod); gravarObsSel(atual); }
      buscaObs = "";                    // achou e usou: limpa para a próxima
      renderLaudo();
      const c = $("obsBusca");
      if(c) c.focus();
    });
  });
  $("content").querySelectorAll("button[data-obstirar]").forEach(function(b){
    b.addEventListener("click", function(){
      gravarObsSel(obsDaAmostra().filter(function(c){ return c !== b.dataset.obstirar; }));
      renderLaudo();
    });
  });

  $("content").querySelectorAll("button[data-omitir]").forEach(function(b){
    b.addEventListener("click", function(){
      alternarOmitido(orgAtual.id, b.dataset.omitir);
      renderLaudo();
    });
  });
  const bv = $("btnVoltarTodos");
  if(bv) bv.addEventListener("click", function(){
    omitidos[orgAtual.id] = {};
    gravar(K_OMIT, omitidos);
    renderLaudo();
    toast("Todos os antimicrobianos voltaram para o laudo.");
  });

  $("content").querySelectorAll("button.pend").forEach(function(b){
    b.addEventListener("click", function(){
      confirmarLinha(orgAtual.id, b.dataset.pend);
      const foco = b.closest("tr").querySelector("[data-i]");
      const i = foco ? foco.dataset.i : null;
      renderLaudo();
      if(i !== null){
        const novo = $("content").querySelector('[data-i="'+i+'"]');
        if(novo) novo.focus();
      }
    });
  });

  // redesenha mantendo foco e cursor no mesmo campo
  function refazer(i, pos){
    renderLaudo();
    const novo = $("content").querySelector('[data-i="'+i+'"]');
    if(!novo) return;
    novo.focus();
    if(pos != null){ try{ novo.setSelectionRange(pos, pos); }catch(e){} }
  }

  $("content").querySelectorAll("input.cim").forEach(function(inp){
    inp.addEventListener("input", function(){
      const conv = trocarSimbolos(inp.value, inp.selectionStart);
      if(conv[0] !== inp.value){ inp.value = conv[0]; try{ inp.setSelectionRange(conv[1], conv[1]); }catch(e){} }
      setVal(orgAtual.id, inp.dataset.n, inp.value);
      confirmarLinha(orgAtual.id, inp.dataset.n);
      refazer(inp.dataset.i, inp.selectionStart);
    });
    inp.addEventListener("paste", function(e){
      const t = (e.clipboardData || window.clipboardData).getData("text");
      if(!t || !/[\r\n]/.test(t)) return;                    // colagem simples: comportamento normal
      e.preventDefault();
      colarColuna(Number(inp.dataset.i), t);
    });
    inp.addEventListener("keydown", function(e){
      let d = 0;
      if(e.key === "Enter") d = e.shiftKey ? -1 : 1;
      else if(e.key === "ArrowDown") d = 1;
      else if(e.key === "ArrowUp") d = -1;
      else return;
      e.preventDefault();
      const alvo = $("content").querySelector('[data-i="'+(Number(inp.dataset.i)+d)+'"]');
      if(alvo) alvo.focus(); else if(d > 0) inp.blur();
    });
  });

  $("content").querySelectorAll("select.tri").forEach(function(sel){
    sel.addEventListener("change", function(){
      setVal(orgAtual.id, sel.dataset.n, sel.value);
      confirmarLinha(orgAtual.id, sel.dataset.n);
      refazer(sel.dataset.i, null);
    });
  });
}

/* `<=` e `>=` não existem no teclado brasileiro — converte enquanto digita,
   mantendo o cursor no lugar. */
function trocarSimbolos(v, pos){
  let out = "", p = pos == null ? 0 : pos;
  for(let i = 0; i < v.length; i++){
    const par = v.substr(i, 2);
    if(par === "<=" || par === "=<"){ out += "≤"; if(i < pos - 1) p--; i++; }
    else if(par === ">=" || par === "=>"){ out += "≥"; if(i < pos - 1) p--; i++; }
    else out += v[i];
  }
  return [out, p];
}

/* Colar um bloco de várias linhas distribui os valores coluna abaixo.
   Entram marcados como a conferir — a ordem do equipamento pode não bater. */
function colarColuna(inicio, texto){
  const vals = texto.split(/\r\n|\r|\n/).map(function(x){ return x.trim(); });
  while(vals.length && vals[vals.length-1] === "") vals.pop();
  if(!vals.length) return;

  const campos = [];
  linhas().forEach(function(l){
    if(l.tipo === "cim" || l.tipo === "triagem") campos.push(l);
  });

  let n = 0, k = 0;
  for(let f = inicio; f < campos.length && k < vals.length; f++){
    const l = campos[f];
    if(l.tipo !== "cim") continue;               // triagem não consome valor da coluna
    const v = trocarSimbolos(vals[k++], 0)[0];
    setVal(orgAtual.id, l.n, v);
    if(v){
      if(!pendentes[orgAtual.id]) pendentes[orgAtual.id] = {};
      pendentes[orgAtual.id][l.n] = true;
    }else{
      confirmarLinha(orgAtual.id, l.n);
    }
    n++;
  }
  gravar(K_PEND, pendentes);
  renderLaudo();
  const sobra = vals.length - k;
  toast(n+" campo"+(n===1?"":"s")+" preenchido"+(n===1?"":"s")+
        (sobra > 0 ? " · "+sobra+" valor"+(sobra===1?"":"es")+" a mais foi ignorado" : "")+
        " — confira a ordem.");
}

/* Renomear tem que arrastar junto o corte, o valor digitado, a pendência e os
   apelidos aprendidos — todos são indexados pelo nome da linha. */
function renomearLinha(org, de, para){
  const novo = String(para).trim();
  if(!novo || novo === de) return false;
  if(rowsDe(org).some(function(r){ return r.n === novo; })){
    toast("Já existe “"+novo+"” neste microrganismo.");
    return false;
  }
  rowsEditaveis(org).forEach(function(r){ if(r.n === de) r.n = novo; });
  gravarLinhas();
  [[refs, K_REF], [valores, K_VAL], [pendentes, K_PEND]].forEach(function(par){
    const mapa = par[0][org.id];
    if(mapa && mapa[de] !== undefined){ mapa[novo] = mapa[de]; delete mapa[de]; }
    gravar(par[1], par[0]);
  });
  Object.keys(apelidos).forEach(function(k){ if(apelidos[k] === de) apelidos[k] = novo; });
  gravar(K_ALIAS, apelidos);
  return true;
}

function excluirLinha(org, nome){
  const i = rowsDe(org).findIndex(function(r){ return r.n === nome; });
  if(i < 0) return;
  rowsEditaveis(org).splice(i, 1);
  gravarLinhas();
  // o corte fica guardado: se a linha voltar com o mesmo nome, volta preenchida
  [[valores, K_VAL], [pendentes, K_PEND]].forEach(function(par){
    if(par[0][org.id]) delete par[0][org.id][nome];
    gravar(par[1], par[0]);
  });
}

function moverLinha(org, nome, d){
  const atual = rowsDe(org);
  const i = atual.findIndex(function(r){ return r.n === nome; });
  const j = i + d;
  if(i < 0 || j < 0 || j >= atual.length) return;
  const rows = rowsEditaveis(org);
  const tmp = rows[i]; rows[i] = rows[j]; rows[j] = tmp;
  gravarLinhas();
}

function acrescentarLinha(org, nome){
  const n = String(nome).trim();
  if(!n) return false;
  if(rowsDe(org).some(function(r){ return r.n === n; })){
    toast("Já existe “"+n+"” neste microrganismo.");
    return false;
  }
  rowsEditaveis(org).push({t:"cim", n:n, ref:{sdp:"",sae:"",res:""}});
  gravarLinhas();
  if(!refs[org.id]) refs[org.id] = {};
  if(!refs[org.id][n]) refs[org.id][n] = {sdp:"",sae:"",res:""};
  gravar(K_REF, refs);
  return true;
}

     era. Agora, falhando, o anterior volta e a tela diz isso. */

        gravar(K_FONTE, fonte);

    sincronizar({aoMudar:function(){ render(); }});
  });
  if($("btnDesligar")) $("btnDesligar").addEventListener("click", function(){

    fonteStat = {estado:"desligado", quando:null, linhas:0, erro:null, origem:null};
    render();
    toast("Sincronização desligada.");
  });

  renderRail();
  /* Com a planilha falhando, o rodapé da marca mostrava a versão embutida e

      .join('<span class="dot">·</span>');

  }

  const seg = $("matseg");
  if(comSeg){
    seg.className = "matseg";
    seg.innerHTML = navAtual.m.map(function(m){
      return '<button data-mat="'+esc(m.id)+'" aria-pressed="'+(m.id===orgAtual.id)+'">'+esc(m.mat)+'</button>';
    }).join("");
    seg.querySelectorAll("[data-mat]").forEach(function(b){
      b.addEventListener("click", function(){
        if(b.dataset.mat === orgAtual.id) return;
        orgAtual = POR_ID[b.dataset.mat];
        imp = null;
        render();
      });
    });
  }else{
    seg.className = "";
    seg.innerHTML = "";
  }
  $("navLaudo").setAttribute("aria-current", vista === "laudo");
  $("navRef").setAttribute("aria-current", vista === "ref");
  $("navFonte").setAttribute("aria-current", vista === "fonte");
  $("navSobre").setAttribute("aria-current", vista === "sobre");

  else if(vista === "fonte") renderFonte();
  else if(vista === "sobre") renderSobre();
  else renderLaudo();
}

   COPIAR — HTML formatado igual à planilha (Arial 9pt, bordas, cores)
   ========================================================================== */
function tabelaHTML(){
  const B = "border:1px solid #000000;padding:1px 4px;";
  const F = "font-family:Arial,Helvetica,sans-serif;font-size:9pt;color:#000000;";
  let h = '<table cellspacing="0" cellpadding="0" style="border-collapse:collapse;'+F+'">'+
    '<tr><td width="380" style="'+B+F+'">Microrganismo:&nbsp; '+nomeHTML(orgAtual.nome)+'</td>'+
    '<td width="70" style="'+B+F+'"></td><td width="185" style="'+B+F+'"></td></tr>'+
    '<tr><td style="'+B+F+'font-weight:bold;">ANTIMICROBIANOS</td>'+
    '<td style="'+B+F+'font-weight:bold;text-align:center;">CIM (mg/L)</td>'+
    '<td style="'+B+F+'font-weight:bold;">INTERPRETAÇÃO</td></tr>';
  linhas().forEach(function(l){
    if(l.tipo === "tit"){
      h += '<tr><td colspan="3" style="'+B+F+'font-weight:bold;">'+esc(l.n)+'</td></tr>';
      return;
    }
    if(l.omitido) return;   // tirado do laudo desta amostra
    const bg = l.cat ? "background-color:"+l.cat.fill+";" : "";
    h += '<tr><td style="'+B+F+'">'+esc(l.n)+'</td>'+
         '<td style="'+B+F+'text-align:center;">'+esc(l.tipo === "triagem" ? "" : l.v)+'</td>'+
         '<td style="'+B+F+bg+'">'+(l.cat ? esc(l.cat.txt) : "")+'</td></tr>';
  });
  h += "</table>";

  /* As observações vão logo abaixo do quadro, na mesma cópia. Antes era preciso
     copiar a tabela, colar, voltar ao programa, achar a observação, copiar de
     novo e colar embaixo — quatro passos por observação, num laudo por vez. */
  const obs = obsDaAmostra();
  if(obs.length){
    // Texto corrido embaixo do quadro, sem moldura: observação é texto de
    // laudo, não mais uma tabela para quem lê o resultado.
    obs.forEach(function(cod){
      const o = acharObs(cod);
      if(!o) return;
      h += '<p style="'+F+'margin:10px 0 0;">'+esc(o.t).replace(/\n/g, "<br>")+'</p>';
    });
  }
  return h;
}

function acharObs(cod){
  const L = listaObs();
  for(let i = 0; i < L.length; i++) if(L[i].c === cod) return L[i];
  return null;
}
function tabelaTexto(){
  let t = "Microrganismo:  "+orgAtual.nome+"\t\t\n"+
          "ANTIMICROBIANOS\tCIM (mg/L)\tINTERPRETAÇÃO\n";
  linhas().forEach(function(l){
    if(l.tipo === "tit"){ t += l.n+"\t\t\n"; return; }
    if(l.omitido) return;
    t += l.n+"\t"+(l.tipo === "triagem" ? "" : l.v)+"\t"+(l.cat ? l.cat.txt : "")+"\n";
  });
  const obs = obsDaAmostra();
  if(obs.length){
    t += "\n";
    obs.forEach(function(cod){
      const o = acharObs(cod);
      if(o) t += o.t+"\n";
    });
  }
  return t;
}
async function copiar(){
  const n = contaPend(orgAtual.id);
  if(n && !confirm(n+(n===1
        ? " linha ainda não foi conferida nesta amostra."
        : " linhas ainda não foram conferidas nesta amostra.")+
      "\n\nCopiar assim mesmo?")) return;
  const nFora = linhas().filter(function(l){ return l.omitido; }).length;
  const extra = nFora ? " · "+nFora+" fora do laudo" : "";
  const html = tabelaHTML(), texto = tabelaTexto();
  try{
    if(navigator.clipboard && window.ClipboardItem){
      await navigator.clipboard.write([new ClipboardItem({
        "text/html":  new Blob([html],  {type:"text/html"}),
        "text/plain": new Blob([texto], {type:"text/plain"})
      })]);
      toast("Tabela copiada com as cores."+extra);
      return;
    }
  }catch(e){}
  copiarRico(html);
}
function copiarRico(html){
  const d = document.createElement("div");
  d.setAttribute("style", "position:fixed;left:-10000px;top:0;background:#fff;");
  d.innerHTML = html;
  document.body.appendChild(d);
  const r = document.createRange(); r.selectNodeContents(d);
  const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
  let ok = false;
  try{ ok = document.execCommand("copy"); }catch(e){}
  sel.removeAllRanges(); d.remove();
  toast(ok ? "Tabela copiada com as cores."
           : "Não consegui copiar. Selecione a tabela na tela e use Ctrl+C.");
}
async function copiarTexto(t, msg){
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(t); toast(msg); return;
    }
  }catch(e){}
  const ta = document.createElement("textarea");
  ta.value = t; ta.setAttribute("style", "position:fixed;left:-10000px;top:0;");

/* ==========================================================================
   PLANILHA .XLSX COM AS DUAS ABAS
   Um .xlsx é um ZIP de arquivos XML. Escrito à mão aqui porque o programa é um
   arquivo só e não busca biblioteca nenhuma — e porque o CSV obrigava a criar
   a aba e acertar o nome na mão, que é justamente onde se erra.
   O ZIP sai sem compressão: é mais código comprimir do que o arquivo pesa.
   ========================================================================== */
const TAB_CRC = (function(){
  const t = new Uint32Array(256);
  for(let n = 0; n < 256; n++){
    let c = n;
    for(let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();

function crc32(bytes){
  let c = 0xFFFFFFFF;
  for(let i = 0; i < bytes.length; i++) c = TAB_CRC[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

function zipar(arquivos){
  const enc = new TextEncoder();
  const partes = [], central = [];
  let desloc = 0;

  const u16 = function(n){ return [n & 255, (n >>> 8) & 255]; };
  const u32 = function(n){ return [n & 255, (n >>> 8) & 255, (n >>> 16) & 255, (n >>> 24) & 255]; };

  arquivos.forEach(function(a){
    const nome = enc.encode(a.nome), dados = enc.encode(a.txt), crc = crc32(dados);
    const cab = [].concat([0x50,0x4B,0x03,0x04], u16(20), u16(0), u16(0), u16(0), u16(0),
                          u32(crc), u32(dados.length), u32(dados.length),
                          u16(nome.length), u16(0));
    partes.push(new Uint8Array(cab), nome, dados);
    central.push({nome:nome, crc:crc, tam:dados.length, desloc:desloc});
    desloc += cab.length + nome.length + dados.length;
  });

  const dir = [];
  central.forEach(function(c){
    dir.push(new Uint8Array([].concat([0x50,0x4B,0x01,0x02], u16(20), u16(20), u16(0), u16(0),
                                      u16(0), u16(0), u32(c.crc), u32(c.tam), u32(c.tam),
                                      u16(c.nome.length), u16(0), u16(0), u16(0), u16(0),
                                      u32(0), u32(c.desloc))), c.nome);
  });
  let tamDir = 0;
  dir.forEach(function(d){ tamDir += d.length; });
  const fim = new Uint8Array([].concat([0x50,0x4B,0x05,0x06], u16(0), u16(0),
                                       u16(central.length), u16(central.length),
                                       u32(tamDir), u32(desloc), u16(0)));
  return new Blob(partes.concat(dir, [fim]), {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}

function xmlEsc(t){
  return String(t == null ? "" : t)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    /* O XML do xlsx não aceita caractere de controle. Tabulação, quebra de
       linha e retorno passam; o resto sairia como arquivo corrompido. */
    .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, "");
}

function colunaLetra(i){
  let s = "";
  for(i += 1; i > 0; i = Math.floor((i - 1) / 26)) s = String.fromCharCode(65 + ((i - 1) % 26)) + s;
  return s;
}

function abaXML(linhas){
  const rows = linhas.map(function(l, y){
    const cels = l.map(function(v, x){
      if(v == null || v === "") return "";
      /* s="1" é o estilo com formato "@", ou seja Texto simples. Marcar só o
         tipo da célula não basta: o Google pode reformatar a coluna ao
         importar, e aí "4" e "0,5" na coluna do meio virariam número enquanto
         "2 a 4" ficaria texto — o mesmo estrago que o CSV fazia. Com o formato
         declarado, a coluna chega na planilha já como Texto simples. */
      return '<c r="'+colunaLetra(x)+(y+1)+'" s="1" t="inlineStr"><is><t xml:space="preserve">'+
             xmlEsc(v)+'</t></is></c>';
    }).join("");
    return '<row r="'+(y+1)+'">'+cels+'</row>';
  }).join("");
  /* Formata a coluna inteira como Texto, não só as células que já têm valor.
     É o que protege o que ainda vai ser digitado: sem isso, um corte novo
     escrito numa célula vazia — "4" na coluna do meio — entraria como número e
     o problema voltaria pela edição, que é justamente onde a planilha vive. */
  const largura = Math.max(1, (linhas[0] || [""]).length);
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'+
    '<cols><col min="1" max="'+largura+'" width="20" customWidth="1" style="1"/></cols>'+
    '<sheetData>'+rows+'</sheetData></worksheet>';
}

function gerarXLSX(abas){
  const REL = "http://schemas.openxmlformats.org/officeDocument/2006/relationships";
  const arquivos = [
    {nome:"[Content_Types].xml", txt:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'+
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'+
      '<Default Extension="xml" ContentType="application/xml"/>'+
      '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'+
      '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'+
      abas.map(function(a, i){
        return '<Override PartName="/xl/worksheets/sheet'+(i+1)+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>';
      }).join("")+'</Types>'},
    {nome:"_rels/.rels", txt:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
      '<Relationship Id="rId1" Type="'+REL+'/officeDocument" Target="xl/workbook.xml"/></Relationships>'},
    {nome:"xl/workbook.xml", txt:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="'+REL+'">'+
      '<sheets>'+abas.map(function(a, i){
        return '<sheet name="'+xmlEsc(a.nome)+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>';
      }).join("")+'</sheets></workbook>'},
    {nome:"xl/_rels/workbook.xml.rels", txt:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
      abas.map(function(a, i){
        return '<Relationship Id="rId'+(i+1)+'" Type="'+REL+'/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>';
      }).join("")+
      '<Relationship Id="rId'+(abas.length+1)+'" Type="'+REL+'/styles" Target="styles.xml"/>'+
      '</Relationships>'}
  ];
  /* Um estilo só, e é o que interessa: formato "@" = Texto simples. */
  arquivos.push({nome:"xl/styles.xml", txt:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'+
    '<numFmts count="1"><numFmt numFmtId="164" formatCode="@"/></numFmts>'+
    '<fonts count="1"><font><sz val="11"/><name val="Calibri"/></font></fonts>'+
    '<fills count="2"><fill><patternFill patternType="none"/></fill>'+
    '<fill><patternFill patternType="gray125"/></fill></fills>'+
    '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>'+
    '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>'+
    '<cellXfs count="2">'+
      '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>'+
      '<xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>'+
    '</cellXfs>'+
    '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>'+
    '</styleSheet>'});

  abas.forEach(function(a, i){
    arquivos.push({nome:"xl/worksheets/sheet"+(i+1)+".xml", txt:abaXML(a.linhas)});
  });
  return zipar(arquivos);
}

/* As mesmas linhas que vão para o CSV, sem virar texto: o xlsx recebe os
   valores direto, então não há vírgula nem aspas para escapar — nem risco de
   uma célula com quebra de linha estourar a coluna. */
function linhasCortes(){
  const TIPO = {cim:"cim", triagem:"triagem", tit:"titulo"};
  const L = [["painel","organismo_id","organismo","ordem","tipo","antimicrobiano",
              "sensivel_dose_padrao","aumentando_exposicao","resistente", COL_VERSAO, COL_CARTAO]];
  let versaoPendente = versaoCortes;
  PANELS.forEach(function(p){
    const painel = p.fam+" · "+p.mat;
    let cartaoPendente = cartaoDe(p);
    p.orgs.forEach(function(o){
      rowsDe(o).forEach(function(row, i){
        const r = (row.t === "cim") ? ((refs[o.id] || {})[row.n] || {sdp:"",sae:"",res:""})
                                    : {sdp:"",sae:"",res:""};
        L.push([painel, o.id, o.nome, String(i+1), TIPO[row.t] || row.t, row.n,
                r.sdp, r.sae, r.res, versaoPendente, cartaoPendente]);
        versaoPendente = ""; cartaoPendente = "";
      });
    });
  });
  return L;
}

function linhasObs(){
  const L = [COLS_OBS.slice()];
  listaObs().forEach(function(o){ L.push([o.c, o.t]); });
  return L;
}

function importar(){
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "application/json,.json";
  inp.addEventListener("change", function(){
    const f = inp.files && inp.files[0];
    if(!f) return;
    const fr = new FileReader();
    fr.onload = function(){
      try{
        const bruto = JSON.parse(String(fr.result));
        // backup antigo era só o mapa de cortes; o novo traz lista e apelidos junto
        const cortes = bruto && bruto.versao ? (bruto.cortes || {}) : bruto;
        const listas = bruto && bruto.versao ? (bruto.linhas || {}) : {};
        const aps    = bruto && bruto.versao ? (bruto.apelidos || {}) : {};
        if(!cortes || typeof cortes !== "object") throw new Error("formato");

        const base = refsPadrao(), montado = {};
        ORGS.forEach(function(o){
          const vindo = cortes[o.id];
          if(!vindo){ montado[o.id] = base[o.id]; return; }
          montado[o.id] = {};
          // mantém tudo que veio no arquivo, inclusive antimicrobianos acrescentados
          Object.keys(vindo).forEach(function(a){
            const v = vindo[a] || {};
            montado[o.id][a] = {sdp:v.sdp||"", sae:v.sae||"", res:v.res||""};
          });
          Object.keys(base[o.id]).forEach(function(a){
            if(!montado[o.id][a]) montado[o.id][a] = base[o.id][a];
          });
        });

        const listasOk = {};
        Object.keys(listas).forEach(function(id){
          if(POR_ID[id] && Array.isArray(listas[id]) && listas[id].length) listasOk[id] = listas[id];
        });

        refs = montado;         gravar(K_REF, refs);
        linhasCustom = listasOk; gravarLinhas();
        apelidos = Object.assign({}, apelidos, aps); gravar(K_ALIAS, apelidos);
        render();
        const nl = Object.keys(listasOk).length;
        toast("Backup importado." + (nl ? " " + nl + " microrganismo(s) com lista própria." : ""));
      }catch(e){ toast("Arquivo inválido. Use um backup gerado por este sistema."); }
    };
    fr.readAsText(f);
  });
  inp.click();
}

if("serviceWorker" in navigator && location.protocol.indexOf("http") === 0){
  // updateViaCache "none": o navegador nunca serve este script do próprio
  // cache HTTP. Sem isso ele pode adiar a checagem e a máquina ficaria numa

  /* O register sozinho deveria mandar o navegador conferir se o sw.js mudou,

       Solto em file://, daqui não há como trocar o arquivo da pessoa: o
       melhor que se faz é levá-la à página de download. */
    const instalado = "serviceWorker" in navigator && !!navigator.serviceWorker.controller;
    a.innerHTML = "<b>Versão nova: " + esc(v.versao) + "</b>" +
                  (instalado ? "clique para atualizar" : "clique para baixar");
    a.title = (v.notas ? v.notas + " — " : "") +
              (instalado ? "recarrega já na versão nova" : "abre a página para baixar");
    if(instalado){
      a.href = "#";
      a.removeAttribute("target");
      a.addEventListener("click", function(ev){
        ev.preventDefault();
        // força a checagem antes de recarregar, senão a primeira recarga
        // ainda pode servir a cópia velha e o aviso volta
        navigator.serviceWorker.getRegistration()
          .then(function(reg){ return reg ? reg.update() : null; })
          .catch(function(){})
          .then(function(){ location.reload(); });
      });
    }
    a.classList.add("mostra");
  })
  .catch(function(){});
</script>

</body>
</html>
