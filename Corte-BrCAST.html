<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Corte BrCAST</title>
<meta name="theme-color" content="#0d6c72">
<!-- Instalação como programa. Só valem servidos por https; abertos do disco,
     o navegador ignora os dois em silêncio e nada muda. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:ital,wght@1,400;1,500&display=swap">

<style>
:root{
  --ground:#f4f6f8; --surface:#ffffff; --surface-2:#eaeef1;
  --ink:#101820; --ink-2:#48555f; --ink-3:#78858f;
  --rule:#d3dae0; --rule-strong:#aab4bd;
  --accent:#0d6c72; --accent-ink:#0b5c61; --accent-soft:#dfeeee;
  --sdp:#B7E1CD; --sae:#CFE2F3; --res:#F4CCCC; --warn:#FBE3B4;
  --sdp-ink:#1a5637; --sae-ink:#1b466c; --res-ink:#8a2320; --warn-ink:#75500e;
  --btn-primary-ink:#ffffff;
  --shadow:0 1px 2px rgba(16,24,32,.05),0 10px 26px -18px rgba(16,24,32,.3);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0c1116; --surface:#141c22; --surface-2:#1c252c;
    --ink:#e4ebf0; --ink-2:#9aa8b3; --ink-3:#6d7b86;
    --rule:#26323b; --rule-strong:#3c4c58;
    --accent:#4fb9bd; --accent-ink:#7fd6d9; --accent-soft:#123238;
    --sdp:#1d4b36; --sae:#1a3b59; --res:#57231f; --warn:#4a3810;
    --sdp-ink:#a3ddbe; --sae-ink:#a9cdec; --res-ink:#f0b4b1; --warn-ink:#efce8c;
    --btn-primary-ink:#07171a;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 26px -18px rgba(0,0,0,.85);
  }
}
:root[data-theme="dark"]{
  --ground:#0c1116; --surface:#141c22; --surface-2:#1c252c;
  --ink:#e4ebf0; --ink-2:#9aa8b3; --ink-3:#6d7b86;
  --rule:#26323b; --rule-strong:#3c4c58;
  --accent:#4fb9bd; --accent-ink:#7fd6d9; --accent-soft:#123238;
  --sdp:#1d4b36; --sae:#1a3b59; --res:#57231f; --warn:#4a3810;
  --sdp-ink:#a3ddbe; --sae-ink:#a9cdec; --res-ink:#f0b4b1; --warn-ink:#efce8c;
  --btn-primary-ink:#07171a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 26px -18px rgba(0,0,0,.85);
}

/* Sem isto o navegador desenha os controles nativos sempre no tema claro, e
   no escuro o texto digitado some dentro do campo. */
:root{color-scheme:light dark}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased;
}
i{font-family:"IBM Plex Serif",Georgia,"Times New Roman",serif; font-style:italic}
.mono{font-family:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace; font-variant-numeric:tabular-nums}
button,input,select{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:3px}

.shell{display:grid; grid-template-columns:250px minmax(0,1fr); min-height:100vh}

/* ---------- trilha lateral ---------- */
.rail{border-right:1px solid var(--rule); background:var(--surface); display:flex; flex-direction:column;
      position:sticky; top:0; height:100vh; overflow:hidden}
.brand{padding:17px 18px 13px; border-bottom:1px solid var(--rule)}
.brand h1{margin:0; font-size:15px; font-weight:600; letter-spacing:-.01em}
.brand .sub{margin-top:2px; font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); font-weight:600}
.railsearch{padding:9px 10px; border-bottom:1px solid var(--rule)}
.railsearch input{width:100%; border:1px solid var(--rule-strong); background:var(--ground);
  border-radius:6px; padding:6px 10px; font-size:13px}
.railsearch input::placeholder{color:var(--ink-3)}
.railsearch input:focus{outline:2px solid var(--accent); outline-offset:-1px}
.orglist{overflow-y:auto; flex:1; padding:6px 8px 14px}
.semnada{padding:16px 10px; font-size:12.5px; color:var(--ink-3); line-height:1.5}
.grouphead{
  padding:13px 10px 5px; font-size:9.5px; letter-spacing:.11em; text-transform:uppercase;
  color:var(--ink-3); font-weight:700; position:sticky; top:0; background:var(--surface);
}
.grouphead .mat{color:var(--accent-ink); font-weight:600}
.orgbtn{display:block; width:100%; text-align:left; background:none; border:0; cursor:pointer;
        padding:6px 10px; border-radius:5px; font-size:13.5px; color:var(--ink-2); line-height:1.3}
.orgbtn:hover{background:var(--surface-2); color:var(--ink)}
.orgbtn[aria-current="true"]{background:var(--accent-soft); color:var(--accent-ink); font-weight:600}
.orgbtn .dois{float:right; font-size:9px; letter-spacing:.06em; text-transform:uppercase;
  color:var(--ink-3); font-weight:600; margin-top:2px}
.orgbtn[aria-current="true"] .dois{color:var(--accent-ink); opacity:.75}
.rail-foot{border-top:1px solid var(--rule); padding:9px 8px; display:flex; flex-direction:column; gap:1px}

.main{min-width:0; display:flex; flex-direction:column}
.topbar{position:sticky; top:0; z-index:20; background:var(--ground); border-bottom:1px solid var(--rule);
        padding:15px 28px 13px; display:flex; align-items:flex-end; gap:20px; flex-wrap:wrap}
.topbar .who{flex:1; min-width:230px}
.eyebrow{font-size:10px; letter-spacing:.11em; text-transform:uppercase; color:var(--ink-3); font-weight:600}
.eyebrow .dot{color:var(--rule-strong); margin:0 6px}
.topbar h2{margin:2px 0 0; font-size:24px; font-weight:500; letter-spacing:-.015em; text-wrap:balance}
.titlerow{display:flex; align-items:center; gap:14px; flex-wrap:wrap}
.matseg{display:inline-flex; border:1px solid var(--rule-strong); border-radius:7px; overflow:hidden;
  background:var(--surface)}
.matseg button{border:0; background:none; cursor:pointer; padding:5px 12px; font-size:12.5px;
  font-weight:500; color:var(--ink-2); white-space:nowrap}
.matseg button + button{border-left:1px solid var(--rule)}
.matseg button:hover{background:var(--surface-2); color:var(--ink)}
.matseg button[aria-pressed="true"]{background:var(--accent); color:var(--btn-primary-ink); font-weight:600}
.actions{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.btn{border:1px solid var(--rule-strong); background:var(--surface); border-radius:6px;
     padding:7px 13px; font-size:13.5px; font-weight:500; cursor:pointer; white-space:nowrap;
     min-height:36px}
/* Nos formulários o botão é alvo de toque de verdade, não item de barra. */
.fonte-campo .btn, .fonte-saida .btn{min-height:44px}
.fonte-campo input{min-height:44px}
.btn:hover{border-color:var(--accent); color:var(--accent-ink)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--btn-primary-ink)}
.btn.primary:hover{filter:brightness(1.07); color:var(--btn-primary-ink)}
.btn.ghost{border-color:transparent; background:none; color:var(--ink-2); text-align:left}
.btn.ghost:hover{background:var(--surface-2); color:var(--ink)}
.btn.ghost[aria-current="true"]{background:var(--accent-soft); color:var(--accent-ink); font-weight:600}
/* Aviso de versao nova. Vem depois de .btn de proposito: mesma
   especificidade, entao quem manda e a ordem. Nasce escondido: o estado normal e nao ter aviso.
   So a rede o acende, e so quando ha mesmo versao diferente publicada. */
/* Aviso de versao nova. Vem depois de .btn de proposito: mesma especificidade,
   entao quem manda e a ordem. Nasce escondido -- o estado normal e nao ter
   aviso. Nada de bloco ambar cheio: e um recado, nao um botao de acao, e
   competir com a navegacao ao lado so atrapalha. O texto quebra em duas
   linhas porque a barra e estreita e "atualizar" nao pode ficar cortado. */
.avisonova{display:none; text-decoration:none; margin:2px 0 7px; padding:7px 10px;
           border:0; border-left:3px solid var(--warn-ink); border-radius:0 5px 5px 0;
           background:var(--surface-2); color:var(--ink-2);
           font-size:12px; font-weight:500; line-height:1.4; white-space:normal}
.avisonova.mostra{display:block}
.avisonova b{display:block; color:var(--ink); font-weight:600}
.avisonova:hover{background:var(--warn); color:var(--warn-ink)}
.avisonova:hover b{color:var(--warn-ink)}
/* Versao do programa. Some no canto ate alguem precisar dela -- e quem precisa
   esta conferindo se a atualizacao entrou. */
.versaoapp{padding:7px 11px 0; font-size:11px; color:var(--ink-3);
           font-variant-numeric:tabular-nums; letter-spacing:.02em}
/* O endereco de origem, no pe da barra. Quem recebeu o arquivo por mensagem nao
   tem outro jeito de descobrir de onde ele veio. */
.origem{padding:1px 11px 2px; font-size:11px; line-height:1.35}
.origem a{color:var(--ink-3); text-decoration:none}
.origem a:hover{color:var(--accent-ink); text-decoration:underline}
.sobre-corpo{padding:14px 18px}
.sobre-corpo p{margin:0 0 10px; font-size:13.5px; color:var(--ink-2); max-width:76ch}
.sobre-corpo p:last-child{margin-bottom:0}
.sobre-corpo strong{color:var(--ink)}
.sobre-url{font-size:15px !important}
.sobre-url a{color:var(--accent-ink); font-weight:600}
.sobre-versao{font-size:12.5px !important; color:var(--ink-3) !important; max-width:none;
              border-top:1px solid var(--rule); padding-top:10px; margin-top:13px !important}

.content{padding:20px 28px 90px; max-width:1220px}
.panel{background:var(--surface); border:1px solid var(--rule); border-radius:9px; box-shadow:var(--shadow); overflow:hidden}
.tablewrap{overflow-x:auto}

table.grid{border-collapse:collapse; width:100%; font-size:13.5px}
table.grid th{text-align:left; font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3);
              font-weight:700; padding:9px 14px; border-bottom:1px solid var(--rule); background:var(--surface-2); white-space:nowrap}
table.grid td{padding:0; border-bottom:1px solid var(--rule); vertical-align:middle}
/* padding:0 existe para a célula de digitar CIM no laudo. Fora dali o texto
   encostava na moldura; nas tabelas de configuração ele volta a respirar. */
.panel > .tablewrap table.grid td, .ajuda table.grid td{padding:8px 18px}
#content .panel .tablewrap table.grid td:first-child{white-space:nowrap}
table.grid tr:last-child td{border-bottom:0}
.c-abx{padding:8px 14px; min-width:280px; line-height:1.3}
.c-cim{width:120px; border-left:1px solid var(--rule); border-right:1px solid var(--rule)}
.c-int{width:245px}
.c-corte{width:180px; padding:8px 14px; border-left:1px solid var(--rule)}
tr.sec td{background:var(--surface-2); padding:9px 14px; font-size:10.5px; letter-spacing:.07em;
          text-transform:uppercase; font-weight:700; color:var(--ink-2)}

input.cim, select.tri{
  width:100%; border:0; background:transparent; padding:9px 10px; text-align:center;
  font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace; font-variant-numeric:tabular-nums;
  font-size:13.5px; font-weight:500; border-radius:0; -webkit-appearance:none; appearance:none;
}
select.tri{cursor:pointer; text-align-last:center}
input.cim::placeholder{color:var(--ink-3); font-weight:400}
input.cim:focus, select.tri:focus{outline:2px solid var(--accent); outline-offset:-2px; background:var(--surface-2)}

.tag{display:block; padding:8px 14px; font-size:12.5px; font-weight:600; line-height:1.25; border-left:3px solid transparent}
.tag.sdp{background:var(--sdp); color:var(--sdp-ink); border-left-color:var(--sdp-ink)}
.tag.sae{background:var(--sae); color:var(--sae-ink); border-left-color:var(--sae-ink)}
.tag.res{background:var(--res); color:var(--res-ink); border-left-color:var(--res-ink)}
.tag.warn{background:var(--warn); color:var(--warn-ink); border-left-color:var(--warn-ink)}
.tag.empty{color:var(--ink-3); font-weight:400; font-style:italic}

/* linha herdada da amostra anterior, ainda não conferida */
.abxrow{display:flex; align-items:flex-start; gap:7px}
.pendslot{width:11px; flex:none; padding-top:2px}
button.pend{width:11px; height:11px; padding:0; border:0; border-radius:50%; cursor:pointer;
  background:var(--warn-ink); display:block}
button.pend:hover{filter:brightness(1.25)}
input.cim.pendente{color:var(--warn-ink); font-style:italic}
.sumcell.pendente .v{color:var(--warn-ink)}
/* Fora do laudo. O estado quem diz é a própria linha — riscada, apagada, com
   fundo. O botão diz sempre a AÇÃO, nunca o estado: antes "tirar do laudo",
   depois "incluir". Rótulo de estado num botão faz a pessoa achar que não há
   como desfazer. E nada de âmbar aqui: no resto do programa âmbar quer dizer
   "confira isto", e não é disso que se trata. */
/* Precisa de table.grid na frente: "table.grid td{padding:0}" tem mais
   especificidade e engolia o espaçamento — o ícone ficava colado na borda. */
/* Precisa de table.grid na frente: "table.grid td{padding:0}" tem mais
   especificidade e engolia o espaçamento — o ícone ficava colado na borda.
   11px aqui porque o botão tem 6px próprios e o ícone 1px de traço: o desenho
   do olho acaba a 18px da borda, o mesmo respiro que o nome do antimicrobiano
   tem do outro lado. A conta é essa, não o olho. */
table.grid td.c-fim{width:1%; padding:4px 11px 4px 16px; text-align:right; white-space:nowrap}
/* Fica apagado o tempo todo em vez de sumir: sumindo, ninguém descobre que
   existe; aceso o tempo todo, disputa atenção com o resultado. */
.omitir{border:1px solid transparent; background:none; cursor:pointer; color:var(--ink-3);
        padding:6px; border-radius:7px; opacity:.28; display:inline-flex;
        transition:opacity .12s, background .12s, color .12s, border-color .12s}
.omitir svg{width:17px; height:17px; display:block}
tr:hover .omitir{opacity:.75}
.omitir:hover, .omitir:focus-visible{opacity:1; color:var(--accent-ink);
                                     background:var(--surface-2); border-color:var(--rule)}
.omitir.ativo{opacity:1; color:var(--accent-ink); border-color:var(--accent);
              background:var(--accent-soft)}
.omitir.ativo:hover{background:var(--accent); border-color:var(--accent); color:var(--btn-primary-ink)}
tr.omitida{background:var(--surface-2)}
tr.omitida .abxnome, tr.omitida .c-cim, tr.omitida .c-int, tr.omitida .c-corte{opacity:.42}
tr.omitida .abxnome{text-decoration:line-through}
/* A tela tinha duas zonas com o mesmo peso visual: o que se faz aqui e o que
   se consulta. Cinco caixas cinzas com sombra, iguais entre si e iguais aos
   painéis de ação, viravam um empilhamento sem hierarquia — a documentação
   ocupava mais tela que a tarefa.

   Agora a ajuda é um bloco só, com divisores finos por dentro. Some a moldura
   repetida, e a diferença entre agir e consultar volta a ser visível. */
.ajudas{border:1px solid var(--rule); border-radius:10px; overflow:hidden;
        background:var(--surface); margin-top:10px}
/* Esta tela é de ler e decidir, não de olhar tabela larga. Sem limite, as
   linhas passavam de cem caracteres nas telas do laboratório. */
#content .panel, #content .ajudas, #content .ajudas-titulo, #content .selo,
#content .hint, #content .erros{max-width:920px}
.ajudas-titulo{font-size:11px; font-weight:700; letter-spacing:.09em; text-transform:uppercase;
               color:var(--ink-3); margin:26px 2px 9px}
.ajuda{border-bottom:1px solid var(--rule)}
.ajuda:last-child{border-bottom:0}
.ajuda > summary{cursor:pointer; padding:13px 18px; font-weight:600; font-size:13.5px;
                 color:var(--ink-2); list-style:none; display:flex; align-items:center; gap:10px}
.ajuda > summary::-webkit-details-marker{display:none}
.ajuda > summary::before{content:"▸"; color:var(--ink-3); font-size:11px;
                         transition:transform .12s; flex:none}
.ajuda[open] > summary{color:var(--ink); background:var(--surface-2)}
.ajuda[open] > summary::before{transform:rotate(90deg)}
.ajuda > summary:hover{color:var(--accent-ink)}
.ajuda-corpo{padding-bottom:6px; border-top:1px solid var(--rule)}
.ajuda-sub{margin:13px 18px 0; font-size:12.5px; color:var(--ink-2); max-width:76ch}
.ajuda .tablewrap{margin-top:4px}

/* Desligar é a saída, não um passo: fica separado do que confirma, e explicado. */
.fonte-saida{display:flex; align-items:center; gap:11px; flex-wrap:wrap; margin-top:12px;
             padding-top:12px; border-top:1px solid var(--rule)}
.fonte-saida span{font-size:12.5px; color:var(--ink-2)}
.btn.ghost.perigo{color:var(--res-ink)}
.btn.ghost.perigo:hover{background:var(--res); color:var(--res-ink); border-color:transparent}

.obsbox{margin-top:16px}
.obscorpo{padding:14px 18px}
.obsvazio{margin:0 0 12px; font-size:13px; color:var(--ink-3)}
.obslista{display:flex; flex-direction:column; gap:9px; margin-bottom:13px}
.obsitem{display:flex; align-items:flex-start; gap:11px; background:var(--surface-2);
         border:1px solid var(--rule); border-radius:8px; padding:10px 12px}
.obsitem.perdida{border-color:var(--warn-ink); background:var(--warn)}
.obscod{flex:none; font-family:"IBM Plex Mono",monospace; font-size:11px; font-weight:600;
        color:var(--accent-ink); background:var(--surface); border:1px solid var(--rule);
        border-radius:5px; padding:3px 7px; margin-top:1px}
.obstxt{flex:1; min-width:0; font-size:13px; line-height:1.5; color:var(--ink-2);
        white-space:pre-wrap}
.obstirar{flex:none; border:1px solid transparent; background:none; cursor:pointer;
          color:var(--ink-3); padding:5px; border-radius:6px; display:inline-flex;
          transition:color .12s, background .12s, border-color .12s}
.obstirar svg{width:15px; height:15px; display:block}
.obstirar:hover{color:var(--res-ink); background:var(--surface); border-color:var(--rule)}
.obsadd .search{width:100%; font-family:inherit; font-size:13.5px;
                padding:10px 12px; border:1px solid var(--rule-strong); border-radius:7px;
                background:var(--surface); color:var(--ink)}
.obsadd .search:focus{outline:2px solid var(--accent); outline-offset:-1px; border-color:var(--accent)}
.obsdica{margin:9px 2px 0; font-size:12px; color:var(--ink-2)}
.obstodas{display:flex; align-items:center; gap:11px; flex-wrap:wrap; margin-top:10px}
.obstodas .obsdica{margin:0}
.obsver{font-size:12.5px; padding:7px 12px; min-height:38px}
/* A lista inteira são 68 itens: rola dentro da própria caixa em vez de
   empurrar o resto da tela para longe. */
.obsrolagem{max-height:290px; overflow-y:auto}
.obsachados{margin-top:9px; border:1px solid var(--rule); border-radius:8px; overflow:hidden}
.obsop{display:flex; gap:10px; align-items:flex-start; width:100%; text-align:left;
       background:var(--surface); border:0; border-bottom:1px solid var(--rule);
       padding:9px 12px; cursor:pointer; font-family:inherit; font-size:12.5px;
       line-height:1.45; color:var(--ink-2)}
.obsop:last-child{border-bottom:0}
.obsop:hover, .obsop:focus-visible{background:var(--accent-soft); color:var(--ink)}
.obsop-txt{flex:1; min-width:0}
.obsop mark{background:var(--warn); color:var(--warn-ink); border-radius:2px; padding:0 1px}
.avisofora{display:flex; align-items:center; gap:11px; flex-wrap:wrap; margin-bottom:14px;
           border-left:3px solid var(--warn-ink); background:var(--surface-2);
           padding:9px 13px; font-size:13px; color:var(--ink-2)}
.avisofora .btn{background:transparent; border-color:var(--rule-strong);
                padding:4px 10px; font-size:12.5px}
.sumcell.fora .v{color:var(--warn-ink)}
.avisopend{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px;
  background:var(--warn); color:var(--warn-ink); border:1px solid var(--warn-ink);
  border-radius:8px; padding:9px 14px; font-size:13px; font-weight:500}
.avisopend .btn{background:transparent; border-color:var(--warn-ink); color:var(--warn-ink); padding:4px 10px; font-size:12.5px}
.avisopend .btn:hover{background:var(--warn-ink); color:var(--warn)}

/* painel: colar / importar resultado de outro sistema */
.imp{background:var(--surface); border:1px solid var(--accent); border-radius:9px;
  box-shadow:var(--shadow); margin-bottom:16px; overflow:hidden}
.imp header{padding:12px 16px; border-bottom:1px solid var(--rule); background:var(--surface-2);
  display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.imp header h3{margin:0; font-size:14px; font-weight:600; flex:1}
.imp .corpo{padding:14px 16px; display:flex; flex-direction:column; gap:11px}
.imp textarea{width:100%; min-height:130px; resize:vertical; border:1px solid var(--rule-strong);
  border-radius:7px; padding:10px 12px; background:var(--ground); color:var(--ink);
  font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace; font-size:12.5px; line-height:1.5}

.corte{font-size:11.5px; color:var(--ink-3); display:flex; gap:9px; flex-wrap:wrap}

.summary{display:flex; border:1px solid var(--rule); border-radius:9px; overflow:hidden;

.sumcell .k{font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); font-weight:700}
.sumcell .v{font-size:21px; font-weight:600; font-family:"IBM Plex Mono",monospace; line-height:1.2; margin-top:1px}
.sumcell.sdp .v{color:var(--sdp-ink)} .sumcell.sae .v{color:var(--sae-ink)}

.hint{font-size:12.5px; color:var(--ink-2); margin:13px 2px 0; max-width:76ch}
.dicas{display:grid; grid-template-columns:repeat(auto-fit, minmax(230px, 1fr));

.dicas > div{font-size:12.5px; line-height:1.5; color:var(--ink-2); max-width:52ch}

.refhead{padding:13px 18px; border-bottom:1px solid var(--rule); background:var(--surface-2)}

          font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace; font-size:13px; text-align:center; border-radius:4px}
input.ref:hover{border-color:var(--rule)}
input.ref:focus{outline:2px solid var(--accent); outline-offset:-2px; background:var(--surface-2)}

input.ref:not(:focus)::placeholder{color:transparent}
input.ref::placeholder{color:var(--ink-3); font-style:italic}
.c-ref{width:135px; border-left:1px solid var(--rule)}

input.nome:focus{outline:2px solid var(--accent); outline-offset:-2px; background:var(--surface-2)}
.c-abx .src{font-size:11px; color:var(--ink-3); margin:1px 0 0 9px}

table.reftab .c-acoes{width:78px}

.addrow{display:flex; gap:8px; padding:12px 14px; border-top:1px solid var(--rule); background:var(--surface-2)}

/* observacoes */

.obslist{display:flex; flex-direction:column; gap:9px}

const OBS    = [{"c":"Bac 1","t":"Bactéria produtora de \"E.S.B.L.\" (beta-lactamase de espectro estendido)."},{"c":"Bac 2","t":"CARBAPENEMASE DETECTADA\n(Método: mCIM - Método Modificado de Inibição de Carbapenens para Enterobactérias e Pseudomonas aeruginosa suspeitos de produção de carbapenemases (CLSI, 2019/BrCAST 2018."},{"c":"Bac 3","t":"Em LCR - S. pneumoniae com resultado resistente (R), na triagem com oxacilina (halo \u003c9mm) é resistente à  benzilpenicilina e à fenoximetilpenicilina"},{"c":"Bac 4","t":"Amostra coletada através de sonda vesical de demora, 2 dias após sua troca."},{"c":"Bac 5","t":"A amostra estava inadequada para cultura por apresentar grande quantidade de células epiteliais escamosas. Se o clínico considerar necessário, favor realizar nova coleta."},{"c":"Bac 6","t":"Para a interpretação deste antibiograma foram utilizados os critérios preconizados pelo CLSI 2019."},{"c":"Bac 10","t":"Bactéria produtora de \"K.P.C.\" (Klebsiella pneumoniae carbapenemase)."},{"c":"Bac 11","t":"Bactéria produtora de NDM (New Delhi Metallobetalactamase)."},{"c":"Bac 12","t":"Em função da positividade do teste fenotípico para (MBL) metalo-betalactamase (bloqueio enzimático com EDTA) este isolado será encaminhado ao LACEN-PR para realização de PCR para blaNDM."},{"c":"Bac 13","t":"A detecção de KPC foi realizada por bloqueio enzimático com ácido fenilborônico, método com especificidade superior a 99%."},{"c":"Bac 14","t":"Provável mecanismo de resistência aos carbapenêmicos: AmpC mais perda de porina."},{"c":"Bac 15","t":"Os testes fenotípicos para KPC, metalo-betalactamases e AmpC apresentaram resultados negativos. A resistência aos carbapenêmicos pode indicar a presença de carbapenemase OXA-48 like ou ESBL mais perda de porinas."},{"c":"Bac 16","t":"PESQUISA DE GENES DE RESISTÊNCIA:\n(Exame realizado no LACEN - PR)\n\nMétodo: PCR em Tempo Real (Taqman)\nMicrorganismo:\nGene pesquisado: bla KPC           Resultado: Detectável.\nGene pesquisado: bla NDM         Resutado: Detectável.\nGene pesquisado: mcr-1              Resultado: Não detectável."},{"c":"Bac 17","t":"PESQUISA DE GENES DE RESISTÊNCIA:\n(Exame realizado no LACEN - PR)\n\nMétodo: PCR em Tempo Real (Taqman)\nMicrorganismo:\nGene pesquisado: bla KPC           Resultado: Detectável.\nGene pesquisado: bla NDM         Resutado: Não detectável.\nGene pesquisado: mcr-1              Resultado: Não detectável."},{"c":"Bac 18","t":"PESQUISA DE GENES DE RESISTÊNCIA:\n(Exame realizado no LACEN - PR)\n\nMétodo: PCR em Tempo Real (Taqman)\nMicrorganismo:\nGene pesquisado: bla KPC           Resultado: Não detectável.\nGene pesquisado: bla NDM         Resutado: Detectável.\nGene pesquisado: mcr-1               Resultado: Não detectável."},{"c":"Bac 19","t":"PESQUISA DE GENES DE RESISTÊNCIA:\n(Exame realizado no LACEN - PR)\n\nMétodo: PCR em Tempo Real (Taqman)\nMicrorganismo:\nGene pesquisado: bla KPC           Resultado: Não detectável.\nGene pesquisado: bla NDM         Resutado: Não detectável.\nGene pesquisado: mcr-1              Resultado: Não detectável."},{"c":"Bac 20","t":"CARBAPENEMASE NÃO DETECTADA.\n(Método: mCIM - Método Modificado de Inibição de Carbapenens para Enterobactérias e Pseudomonas aeruginosa suspeitos de produção de carbapenemases (CLSI, 2019/BrCAST 2018)."},{"c":"Bac 21","t":"Em isolados de E. coli, Klebsiella spp. (exceto K. aerogenes), Raoultella spp SENSÍVEIS À CEFALOSPORINA DE 3ª GERAÇÃO (cefotaxima, ceftriaxona, ceftazidima) ou 4ª GERAÇÃO (cefepima), mas com produção de ESBL, o resultado terapêutico é incerto para outras infecções além de infecções do trato urinário. As evidências disponíveis indicam que o fenótipo (sensível ou resistente) para essas cefalosporinas prevê o resultado do tratamento em isolados capazes de produzir ESBL, embora ainda haja uma escassez de dados clínicos fora do trato urinário.\nObservação do laudo, versão compacta para o médico.\n\nEm isolados de E. coli, Klebsiella spp. (exceto K. aerogenes), Raoultella spp SENSÍVEIS À CEFALOSPORINA DE 3ª GERAÇÃO (cefotaxima, ceftriaxona, ceftazidima) ou 4ª GERAÇÃO (cefepima), mas com produção de ESBL, o resultado terapêutico é incerto para outras infecções além de infecções do trato urinário."},{"c":"Bac 22","t":"E. coli, Klebsiella spp. (exceto K. aerogenes), Raoultella spp: se RESISTENTES para qualquer CEFALOSPORINA DE 3ª GERAÇÃO (cefotaxima, ceftriaxona, ceftazidima) ou 4ª GERAÇÃO (cefepima) e SENSÍVEIS a PIPERACILINA-TAZOBACTAM ou AMOXICILINA ÁCIDO CLAVULÂNICO - informar conforme resultado do teste. Este fenótipo é mais frequentemente causado pela produção de ESBL. Os produtores de ESBL às vezes testam como sensíveis a combinações beta-lactâmicos/inibidor de beta-lactamase. O uso dessas combinações em infecções causadas por produtores de ESBL tem sido historicamente controverso, mas uma série de estudos têm mostrado que o uso é seguro, desde que dosagem apropriada seja usada. Uma publicação indica que a terapia com carbapenêmico pode ser superior a piperacilina/tazobactam, principalmente em pacientes com câncer terminal\n\nObservação do laudo, versão compacta para o médico.\n\nEscherichia coli, Klebsiella spp. (exceto K. aerogenes), Raoultella spp., produtores de ß Lactamase de espectro estendido (ESBL), podem testar como sensíveis à PIPERACILINA-TAZOBACTAM ou AMOXICILINA/ÁCIDO CLAVULÂNICO. Entretanto, o uso dessas combinações em infecções causadas por produtores de ESBL tem sido historicamente controverso."},{"c":"Bac 23","t":"A monoterapia com CEFOTAXIMA, CEFTRIAXONA OU CEFTAZIDIMA em Enterobacter spp., Klebsiella aerogenes, Citrobacter freundii (incluindo: C. braakii, C. murliniae, C. werkmanii, C. youngae) e Hafnia alvei, mesmo que sensíveis a essas cefalosporinas, deve ser desencorajada, bem como o uso em combinação com um aminoglicosídeo, devido ao risco relativamente alto de selecionar mutantes (com produção de AmpC) resistentes à essas cefalosporinas, inclusive durante o tratamento. O risco de seleção de mutantes é ausente ou muito diminuído para cefepima.\nObservação do laudo, versão compacta para o médico.\n\nA monoterapia com CEFOTAXIMA, CEFTRIAXONA OU CEFTAZIDIMA em Enterobacter spp., Klebsiella aerogenes, Citrobacter freundii (incluindo: C. braakii, C. murliniae, C. werkmanii, C. youngae) e Hafnia alvei, mesmo que sensíveis a essas cefalosporinas, deve ser desencorajada, bem como o uso em combinação com um aminoglicosídeo, devido ao risco relativamente alto de selecionar mutantes (com produção de AmpC) resistentes à essas cefalosporinas, inclusive durante o tratamento. O risco de seleção de mutantes é ausente ou muito diminuído para cefepima."},{"c":"Bac 24","t":"Em Serratia spp., Morganella morganii e Providencia spp., sensíveis à CEFOTAXIMA, CEFTRIAXONA ou CEFTAZIDIMA, a monoterapia com esses antimicrobianos pode raramente selecionar mutantes resistentes."},{"c":"Bac 25","t":"Enterobacter spp., Klebsiella aerogenes, Citrobacter freundii (incluindo: C. braakii, C. murliniae, C. werkmanii, C. youngae), Hafnia alvei, Serratia spp., Morganella morganii e Providencia spp. devem ser considerados resistentes à qualquer cefalosporina de segunda geração , incluindo a CEFUROXIMA, independentemente dos resultados obtidos in vitro."},{"c":"Bac 26","t":"Em urina e outros materiais -  S. pneumoniae com resultado resistente (R), na triagem com oxacilina (halo 9-19mm),   é resistente   à fenoximetilpenicilina,  mas sensível, dose padrão (S-DP) à ampicilina, amoxicilina, piperacilina, amoxicilina/ácido clavulânico, piperacilina/ácido clavulânico, cefepima, cefotaxima, ceftarolina, ceftobiprole, ceftriaxona, imipenem e meropenem."},{"c":"Bac 27","t":"Em LCR, urina e outros materiais - S. pneumoniae com resultado sensível, dose padrão (S-DP), na triagem com oxacilina, é S-DP à: benzilpenicilina, ampicilina, amoxicilina, amoxicilina/ácido clavulânico, piperacilina, piperacilina/tazobactam, fenoximetilpenicilina, cefepima, cefotaxima, ceftarolina, ceftriaxona, cefuroxima, doripenem, ertapenem, imipenem, /* ==========================================================================
   MOTOR — réplica da lógica da planilha (aba "fórmulas", coluna M).
   Validado contra 328 resultados já calculados pelas planilhas: 328 conferem.
   ========================================================================== */

// ">8" => 8,0001 · "<8" => 7,9999 · "≤8"/"≥8" => 8 · "16/2" => 16 (só o 1º número)
function parseCim(raw){
  const s = String(raw == null ? "" : raw).trim();
  if(!s) return "";
  const m = s.match(/\d+(?:[.,]\d+)?/);
  if(!m) return NaN;
  let v = parseFloat(m[0].replace(",", "."));
  if(s.indexOf(">") >= 0) v += 0.0001;
  else if(s.indexOf("<") >= 0) v -= 0.0001;
  return v;
}
function corteNum(raw, vazio){
  const s = String(raw == null ? "" : raw).trim();
  if(!s) return vazio;
  const m = s.match(/\d+(?:[.,]\d+)?/);
  return m ? parseFloat(m[0].replace(",", ".")) : vazio;
}
// "2 a 4" => [2,4] · "4" => [4,4] · "" => ["",""]
function corteIntervalo(raw){
  const s = String(raw == null ? "" : raw).trim();
  if(!s) return ["", ""];
  const n = s.match(/\d+(?:[.,]\d+)?/g);
  if(!n) return ["", ""];
  const a = parseFloat(n[0].replace(",", "."));
  const b = parseFloat(n[n.length-1].replace(",", "."));
  return a <= b ? [a, b] : [b, a];
}
function interpretar(cim, ref){
  const I = corteNum(ref.sdp, 0);
  const iv = corteIntervalo(ref.sae), J = iv[0], K = iv[1];
  const L = corteNum(ref.res, "");

  if(I === 0 && J === "" && K === "" && L === "") return CAT.FALTA;

  const G = parseCim(cim);
  if(G === "") return null;
  if(Number.isNaN(G)) return CAT.CONF;

  if(typeof J === "number" && typeof K === "number"){
    if(G >= J && G <= K) return CAT.SAE;
    if(G < J){
      if(I === "" || I === 0) return CAT.SAE;
      return G <= I ? CAT.SDP : CAT.CONF;
    }
    if(G > K){
      if(L === "" || L === 0) return CAT.SAE;
      return G > L ? CAT.RES : CAT.CONF;
    }
    return CAT.CONF;
  }
  if(I === "" || I === 0){
    if(L === "" || L === 0) return CAT.SAE;
    return G > L ? CAT.RES : CAT.CONF;
  }
  if(L === "" || L === 0) return G <= I ? CAT.SDP : CAT.CONF;
  if(G <= I) return CAT.SDP;
  return G > L ? CAT.RES : CAT.CONF;
}
// Triagem: positivo = resistência detectada
function interpretarTriagem(v){
  if(!v) return null;
  return /^posit/i.test(v) ? {txt:v, cls:"res", fill:"#F4CCCC"} : {txt:v, cls:"sdp", fill:"#B7E1CD"};
}

  const r = {};
  ORGS.forEach(function(o){
    r[o.id] = {};

}
/* Os ids eram painel + posição do microrganismo no painel — resíduo da
   extração das planilhas. Posição é frágil: regerar os dados noutra ordem

const IDS_LEGADO = {"entero_urina__0":"entero_urina__escherichia_coli","entero_urina__1":"entero_urina__klebsiella_pneumoniae_ssp_pneumoniae","entero_urina__2":"entero_urina__citrobacter_koseri","entero_urina__3":"entero_urina__citrobacter_freundii","entero_urina__4":"entero_urina__klebsiella_aerogenes","entero_urina__5":"entero_urina__complexo_enterobacter_cloacae","entero_urina__6":"entero_urina__pluralibacter_gergoviae","entero_urina__7":"entero_urina__proteus_mirabilis","entero_urina__8":"entero_urina__proteus_vulgaris","entero_urina__9":"entero_urina__morganella_morganii","entero_urina__10":"entero_urina__serratia_marcescens","entero_urina__11":"entero_urina__providencia_rettgeri","entero_urina__12":"entero_urina__salmonella_spp","entero_outros__0":"entero_outros__escherichia_coli","entero_outros__1":"entero_outros__klebsiella_pneumoniae_ssp_pneumoniae","entero_outros__2":"entero_outros__proteus_mirabilis","entero_outros__3":"entero_outros__salmonella_sp","entcoc_urina__0":"entcoc_urina__enterococcus_faecalis","entcoc_outros__0":"entcoc_outros__enterococos_faecalis","staph_urina__0":"staph_urina__staphylococcus_aureus","staph_outros__0":"staph_outros__staphylococcus_aureus","staph_outros__1":"staph_outros__staphylococcus_capitis","staph_outros__2":"staph_outros__staphylococcus_hominis","staph_outros__3":"staph_outros__staphylococcus_saprophyticus","staph_outros__4":"staph_outros__staphylococcus_epidermidis","acineto__0":"acineto__complexo_acinetobacter_baumanni","burkholderia__0":"burkholderia__burkholderia_pseudomallei","malto__0":"malto__stenotrophomonas_maltophilia","strepto__0":"strepto__streptococcus_pneumoniae","strepto__1":"strepto__streptococcus_pyogenes","strepto__2":"strepto__streptococcus_acidominimus"};

function ler(k, f){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : f; }catch(e){ return f; } }
function gravar(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

/* Uma vez só: reescreve as chaves gravadas neste navegador para os ids novos,
   para ninguém perder CIM digitado nem corte editado. */
(function migrarIds(){
  let mudou = false;
  const remapear = function(o){
    if(!o || typeof o !== "object") return o;
    const novo = {};
    Object.keys(o).forEach(function(k){
      const n = IDS_LEGADO[k];
      if(n && n !== k){ novo[n] = o[k]; mudou = true; }
      else novo[k] = o[k];
    });
    return novo;
  };
  [K_REF, K_VAL, K_PEND, K_LINHAS].forEach(function(chave){
    const v = ler(chave, null);
    if(!v) return;
    const novo = remapear(v);
    if(mudou) gravar(chave, novo);
  });
})();

    Object.keys(base[o.id]).forEach(function(a){
      const v = salvo[o.id][a];
      salvo[o.id][a] = v ? {sdp:v.sdp||"", sae:v.sae||"", res:v.res||""} : base[o.id][a];
    });
  });
  return salvo;
})();

/* Planilha do laboratório. O arquivo sai sem link: cada laboratório aponta

/* ==========================================================================
   FONTE DOS CORTES — planilha do laboratório

   Os cortes são do laboratório, não da máquina. Quando há uma planilha
   configurada ela manda, e a tela de referências vira somente leitura: é o
   que impede dois PCs interpretarem a mesma cepa de formas diferentes.

   O transporte é JSONP (<script src>), não fetch. Não é preferência: o
   fetch do Google só devolve cabeçalho CORS quando existe uma origem para
   espelhar, e um arquivo aberto do disco tem origem "null". Medido: fetch
   do disco é bloqueado, <script> passa. Por isso o arquivo continua
   funcionando com duplo clique, sem precisar de servidor.
   ========================================================================== */
const COLUNAS = ["painel","organismo_id","organismo","ordem","tipo",
                 "antimicrobiano","sensivel_dose_padrao","aumentando_exposicao","resistente"];
const TIPOS = {cim:"cim", triagem:"triagem", titulo:"tit"};
const CORTES = ["sensivel_dose_padrao","aumentando_exposicao","resistente"];
/* Edição do BrCAST. Vive na planilha, junto dos cortes que ela descreve — no
   programa envelheceria calada. Coluna opcional: basta preencher uma célula,
   em qualquer linha. Sem ela, o rodapé da marca mostra só o laboratório. */
const COL_VERSAO = "versao";

/* Cartão do equipamento (NMIC ID 471, PMIC ID 601, Etest). Vale por painel e
   aparece no supratítulo. Estava só embutido aqui: trocar de cartão obrigava
   a mexer no programa. Coluna opcional — basta preencher uma célula em
   qualquer linha do painel; sem ela vale o que veio de fábrica. */
const COL_CARTAO = "cartao";
let cartoes = {};                       // painel -> cartão vindo da planilha

function cartaoDe(p){
  return (p && (cartoes[p.id] || p.cartao)) || "";
}
const VERSAO_EMBUTIDA = "BrCAST 2024";   // descreve os cortes que vêm no arquivo
let versaoCortes = VERSAO_EMBUTIDA;

/* Versão do programa. Não confundir com a do BrCAST acima: aquela descreve os
   cortes, esta descreve o arquivo. O programa vive solto, uma cópia por
   máquina, e sem isso ninguém saberia que a sua envelheceu. Ao publicar,
   subir este número e o de version.json juntos — se um ficar para trás, o
   aviso mente. */
const VERSAO_APP = "2026.09.02.7";
const URL_VERSAO = "https://eacarva.github.io/corte-brcast/version.json";
const URL_SITE   = "https://eacarva.github.io/corte-brcast/";

/* Aceita o link de edição, o de compartilhar ou um já colado antes. */
function lerLink(txt){
  const t = String(txt == null ? "" : txt).trim();
  if(!t) return {erro:"Cole o link da planilha."};
  if(/\/d\/e\/2PACX-/.test(t))
    return {erro:'Esse é o link de "Publicar na web", que só funciona com o programa hospedado. '+
                 'Cole o link de edição da planilha — o que tem /d/<id>/edit.'};
  const m = t.match(/\/spreadsheets\/d\/([A-Za-z0-9_-]{20,})/);
  if(!m) return {erro:"Não reconheci um link de planilha do Google Sheets."};
  const g = t.match(/[#&?]gid=(\d+)/);
  return {id:m[1], gid:g ? g[1] : "0"};
}
function urlPlanilha(f){
  return "https://docs.google.com/spreadsheets/d/"+f.id+"/edit#gid="+f.gid;
}

/* Uma célula do gviz vira sempre texto. O formatado (f) tem prioridade: se a
   coluna for tipada como número, "8" volta em v como 8 e em f como "8". */
/* Onde estão os nomes das colunas.

   Planilha nativa do Google: o cabeçalho vem em cols[].label e a primeira
   linha já é dado. Mas um .xlsx subido ao Drive sem converter continua sendo
   um .xlsx, e aí o Google devolve label vazio e manda o cabeçalho como
   primeira linha. Os dois casos são normais — a pessoa nem sabe que subiu de
   um jeito ou de outro, e o arquivo que o programa gera é justamente um
   .xlsx. Então procura nos dois lugares. */
function acharCabecalho(tb, obrigatorias){
  const porLabel = tb.cols.map(function(c){ return String(c.label == null ? "" : c.label).trim(); });
  if(obrigatorias.every(function(n){ return porLabel.indexOf(n) >= 0; }))
    return {cols:porLabel, pular:0};

  const linha0 = ((tb.rows || [])[0] || {}).c || [];
  const porLinha = tb.cols.map(function(_, i){ return celula(linha0[i]); });
  if(obrigatorias.every(function(n){ return porLinha.indexOf(n) >= 0; }))
    return {cols:porLinha, pular:1};

  // nenhum dos dois serve: devolve o que houver, para a mensagem de erro dizer o que falta
  return {cols:porLabel.some(Boolean) ? porLabel : porLinha, pular:0};
}

function celula(c){
  if(!c) return "";
  let t;
  if(c.f != null) t = String(c.f);
  else if(c.v == null) t = "";
  else if(typeof c.v === "number") t = String(c.v === Math.round(c.v) ? Math.round(c.v) : c.v);
  else t = String(c.v);
  t = t.trim();
  // Quem formata a célula à mão às vezes digita o apóstrofo de forçar-texto
  // do Sheets. Ele é marcação, não valor.
  return t.charAt(0) === "'" ? t.slice(1).trim() : t;
}

/* Observações do laudo. Vivem numa segunda aba da mesma planilha, chamada
   "observacoes", com as colunas codigo e texto. Ficavam presas no programa, e
   elas mudam: método novo, redação nova, observação que deixa de valer. Aba
   separada porque as colunas não têm nada a ver com as dos cortes — enfiá-las
   na mesma tabela deixaria dezenas de células vazias em cada linha.

   É opcional: sem a aba, valem as que vieram de fábrica. E é lida pelo NOME da
   aba, não pelo gid, para não obrigar ninguém a colar um segundo link. */
let jsonpSeq = 0;
const ABA_OBS = "observacoes";
const COLS_OBS = ["codigo","texto"];
let obsCustom = null;                  // null = não veio da planilha
let obsStat  = {estado:"sem-aba"};

function listaObs(){ return obsCustom && obsCustom.length ? obsCustom : OBS; }

function buscarObs(f, ok, falha){
  const cb = "__brcastOBS" + (++jsonpSeq) + "_" + (+new Date());
  const s = document.createElement("script");
  let fim = false;
  const limpar = function(){
    try{ delete window[cb]; }catch(e){ window[cb] = undefined; }
    if(s.parentNode) s.parentNode.removeChild(s);
  };
  const relogio = setTimeout(function(){
    if(fim) return; fim = true; limpar(); falha("A aba de observações não respondeu.");
  }, 20000);
  window[cb] = function(d){
    if(fim) return; fim = true; clearTimeout(relogio); limpar();
    try{
      if(d && d.status === "error") return falha("sem aba");
      if(!d || !d.table || !d.table.cols) return falha("sem aba");
      const cab = acharCabecalho(d.table, COLS_OBS);
      const cols = cab.cols;
      const faltam = COLS_OBS.filter(function(n){ return cols.indexOf(n) < 0; });
      if(faltam.length)
        return falha('A aba "'+ABA_OBS+'" precisa das colunas '+COLS_OBS.join(" e ")+
                     ". Faltou: "+faltam.join(", ")+".");
      const ic = cols.indexOf("codigo"), it = cols.indexOf("texto");
      const lista = [];
      (d.table.rows || []).slice(cab.pular).forEach(function(r){
        const c = celula((r.c || [])[ic]), t = celula((r.c || [])[it]);
        if(c && t) lista.push({c:c, t:t});
      });
      if(!lista.length) return falha('A aba "'+ABA_OBS+'" está vazia.');
      ok(lista);
    }catch(e){ falha("Não consegui ler a aba de observações: "+e); }
  };
  s.onerror = function(){
    if(fim) return; fim = true; clearTimeout(relogio); limpar(); falha("sem aba");
  };
  s.src = "https://docs.google.com/spreadsheets/d/"+f.id+"/gviz/tq?sheet="+
          encodeURIComponent(ABA_OBS)+"&tqx=responseHandler:"+cb;
  document.head.appendChild(s);
}

function buscarPlanilha(f, ok, falha){
  const cb = "__brcastCB" + (++jsonpSeq) + "_" + (+new Date());
  const s = document.createElement("script");
  let fim = false;
  const limpar = function(){
    try{ delete window[cb]; }catch(e){ window[cb] = undefined; }
    if(s.parentNode) s.parentNode.removeChild(s);
  };
  const relogio = setTimeout(function(){
    if(fim) return; fim = true; limpar();
    falha("A planilha não respondeu em 20 segundos. Sem internet?");
  }, 20000);
  window[cb] = function(d){
    if(fim) return; fim = true; clearTimeout(relogio); limpar();
    try{
      if(!d || !d.table || !d.table.cols) return falha("A planilha respondeu, mas sem tabela.");
      if(d.status === "error"){
        const e = (d.errors && d.errors[0]) || {};
        return falha("O Google recusou: "+(e.detailed_message || e.message || "motivo não informado"));
      }
      const cab = acharCabecalho(d.table, COLUNAS);
      const cols = cab.cols;
      /* CSV que entrou sem ser dividido: a linha inteira num campo só. Sai como
         "faltam todas as colunas", que não diz o que fazer. */
      const primeira = (((d.table.rows || [])[0] || {}).c || [])[0];
      const bruta = primeira ? String(primeira.v == null ? "" : primeira.v) : "";
      if(cols.length <= 2 && bruta.indexOf(",") > 0 && bruta.indexOf("organismo_id") >= 0)
        return falha("A planilha está com tudo numa coluna só — o CSV entrou sem ser separado. "+
          "Reimporte por Arquivo ▸ Importar escolhendo o separador vírgula, ou selecione a coluna A "+
          "e use Dados ▸ Dividir texto em colunas.");

      const faltam = COLUNAS.filter(function(n){ return cols.indexOf(n) < 0; });
      if(faltam.length)
        return falha("Faltam colunas na planilha: "+faltam.join(", ")+
                     ". A primeira linha tem que ser exatamente o cabeçalho do CSV original.");
      const idx = {};
      COLUNAS.forEach(function(n){ idx[n] = cols.indexOf(n); });

      /* Guarda contra perda silenciosa. O Google infere um tipo por coluna: se
         a maioria das células for numérica ele tipa a coluna como número e
         devolve null em toda célula de texto — "≤8" e "2 a 4" somem sem erro
         nenhum. Como célula vazia aqui é legítima, nada mais no programa
         perceberia. Coluna de corte tem que ser texto; se não for, recusamos. */
      /* Só vale conferir o tipo quando o Google inferiu a coluna. Num .xlsx não
         convertido ele devolve tudo como texto, que é o que queremos, e o
         cabeçalho ocupa a primeira linha — o tipo ali não diria nada. */
      const numericas = cab.pular ? [] : CORTES.filter(function(n){
        const c = d.table.cols[idx[n]];
        return c && c.type === "number";
      });
      if(numericas.length)
        return falha("A coluna "+numericas.join(" e ")+" está como NÚMERO na planilha, e assim o Google "+
          "não envia os cortes escritos com texto (≤8, 2 a 4). Correção: selecione a coluna inteira na "+
          "planilha e use Formatar ▸ Número ▸ Texto simples. Os valores não estão perdidos — voltam a ser "+
          "lidos assim que a coluna virar texto, sem precisar importar nada de novo. "+
          "Depois clique em Sincronizar agora.");
      const ic = cols.indexOf(COL_CARTAO);
      const linhas = (d.table.rows || []).slice(cab.pular).map(function(r){
        const o = {};
        COLUNAS.forEach(function(n){ o[n] = celula((r.c || [])[idx[n]]); });
        if(ic >= 0) o.cartao = celula((r.c || [])[ic]);
        return o;
      }).filter(function(o){ return o.organismo_id || o.antimicrobiano; });

      // primeira célula preenchida, em qualquer linha: sobrevive a reordenação
      const iv = cols.indexOf(COL_VERSAO);
      let versao = "";
      if(iv >= 0) (d.table.rows || []).slice(cab.pular).some(function(r){
        const v = celula((r.c || [])[iv]);
        if(v){ versao = v; return true; }
        return false;
      });
      ok(linhas, versao);
    }catch(e){ falha("Não consegui ler a resposta: "+e); }
  };
  s.onerror = function(){
    if(fim) return; fim = true; clearTimeout(relogio); limpar();
    falha("Não consegui abrir a planilha. Verifique se o compartilhamento está em "+
          '"Qualquer pessoa com o link" como Leitor.');
  };
  s.src = "https://docs.google.com/spreadsheets/d/"+f.id+"/gviz/tq?gid="+
          encodeURIComponent(f.gid)+"&tqx=responseHandler:"+cb;
  document.head.appendChild(s);
}

/* Monta cortes e listas a partir das linhas. Recusa tudo se qualquer linha
   estiver ruim: aplicar metade deixaria microrganismo sem antibiótico, e um
   antibiótico que some da tela é mais perigoso que uma sincronização falha. */
function montarConfig(linhas){
  const refsN = {}, listasN = {}, cartoesN = {}, erros = [];
  if(!linhas.length) erros.push("A planilha está vazia.");
  linhas.forEach(function(r, i){
    const ln = i + 2;   // +1 do cabeçalho, +1 porque planilha conta de 1
    const oid = r.organismo_id;
    const alvo = POR_ID[oid] ? oid : IDS_LEGADO[oid];
    if(!alvo || !POR_ID[alvo]){ erros.push("linha "+ln+': microrganismo desconhecido "'+oid+'"'); return; }
    const t = TIPOS[r.tipo];
    if(!t){ erros.push("linha "+ln+': tipo inválido "'+r.tipo+'" (use cim, triagem ou titulo)'); return; }
    const nome = r.antimicrobiano;
    if(!nome){ erros.push("linha "+ln+": sem nome na coluna antimicrobiano"); return; }
    // o id do organismo começa com o id do painel: "entero_urina__escherichia_coli"
    const painelId = String(alvo).split("__")[0];
    if(r.cartao && !cartoesN[painelId]) cartoesN[painelId] = r.cartao;

    const row = {t:t, n:nome, _o:Number(r.ordem) || (i+1)};
    if(t === "cim"){
      row.ref = {sdp:r.sensivel_dose_padrao, sae:r.aumentando_exposicao, res:r.resistente};
      if(!refsN[alvo]) refsN[alvo] = {};
      if(refsN[alvo][nome]) erros.push("linha "+ln+': "'+nome+'" repetido em '+POR_ID[alvo].nome);
      refsN[alvo][nome] = {sdp:row.ref.sdp, sae:row.ref.sae, res:row.ref.res};
    }
    (listasN[alvo] = listasN[alvo] || []).push(row);
  });
  const ausentes = ORGS.filter(function(o){ return !listasN[o.id]; });
  if(ausentes.length && !erros.length)
    erros.push("Sem nenhuma linha para: "+ausentes.map(function(o){ return o.nome; }).join(", "));
  Object.keys(listasN).forEach(function(k){
    listasN[k].sort(function(a,b){ return a._o - b._o; });
    listasN[k].forEach(function(r){ delete r._o; });
  });
  return {refs:refsN, listas:listasN, cartoes:cartoesN, erros:erros, total:linhas.length};
}

/* A config do laboratório entra só na memória. As chaves locais do navegador
   ficam intactas, então desligar a sincronização devolve o que havia antes. */
function aplicarConfig(cfg, origem, quando){
  refs = cfg.refs;
  linhasCustom = cfg.listas;
  cartoes = cfg.cartoes || {};
  fonteStat = {estado:"ok", quando:quando, linhas:cfg.total, erro:null, origem:origem};
}

function sincronizar(opts){
  opts = opts || {};
  if(!fonte){ fonteStat.estado = "desligado"; return; }
  fonteStat.estado = "buscando";
  if(opts.aoMudar) opts.aoMudar();
  buscarPlanilha(fonte, function(linhas, versao){
    const cfg = montarConfig(linhas);
    if(cfg.erros.length){
      fonteStat.estado = usarCache() ? "erro-com-cache" : "erro";
      fonteStat.erro = cfg.erros;
      if(opts.aoMudar) opts.aoMudar();
      return;
    }
    const quando = new Date().toISOString();
    versaoCortes = versao || "";
    aplicarConfig(cfg, "planilha", quando);
    const guardar = function(){
      gravar(K_CACHE, {quando:quando, linhas:cfg.total, refs:cfg.refs, listas:cfg.listas,
                       cartoes:cfg.cartoes, versao:versaoCortes, obs:obsCustom});
      if(opts.aoMudar) opts.aoMudar();
    };
    /* A aba de observações é um extra: se não existir, os cortes já valem e o
       programa segue com as observações de fábrica. Falha aqui não derruba a
       sincronização — só volta a mensagem quando a aba existe e está errada. */
    buscarObs(fonte, function(lista){
      obsCustom = lista;
      obsStat = {estado:"ok", total:lista.length};
      guardar();
    }, function(msg){
      obsCustom = null;
      obsStat = (msg === "sem aba") ? {estado:"sem-aba"} : {estado:"erro", erro:msg};
      guardar();
    });
  }, function(msg){
    fonteStat.estado = usarCache() ? "offline" : "erro";
    fonteStat.erro = [msg];
    if(opts.aoMudar) opts.aoMudar();
  });
}

/* Última sincronização boa. Sem internet o programa continua com os cortes
   certos, avisando de quando eles são. */
function usarCache(){
  const c = ler(K_CACHE, null);
  if(!c || !c.refs || !c.listas) return false;
  refs = c.refs;
  linhasCustom = c.listas;
  cartoes = c.cartoes || {};
  obsCustom = (c.obs && c.obs.length) ? c.obs : null;
  if(obsCustom) obsStat = {estado:"ok", total:obsCustom.length};
  versaoCortes = c.versao == null ? "" : c.versao;
  fonteStat.quando = c.quando;
  fonteStat.linhas = c.linhas;
  fonteStat.origem = "cache";
  return true;
}

function quandoTxt(iso){
  if(!iso) return "nunca";
  const d = new Date(iso);
  if(isNaN(d)) return "nunca";
  const p = function(n){ return (n < 10 ? "0" : "") + n; };
  return p(d.getDate())+"/"+p(d.getMonth()+1)+"/"+d.getFullYear()+" às "+p(d.getHours())+":"+p(d.getMinutes());
}

/* Uma linha de status que cabe em qualquer tela. */
function selo(){
  const q = quandoTxt(fonteStat.quando);
  switch(fonteStat.estado){
    case "ok":              return {cls:"ok",   txt:"Cortes da planilha do laboratório · sincronizado em "+q};
    case "buscando":        return {cls:"neu",  txt:"Buscando os cortes na planilha…"};
    case "offline":         return {cls:"aviso",txt:"Sem conexão com a planilha · usando a cópia de "+q};
    case "erro-com-cache":  return {cls:"aviso",txt:"A planilha tem erro · usando a cópia boa de "+q};
    case "erro":            return {cls:"ruim", txt:"Falha ao ler a planilha · usando os cortes de fábrica"};
    case "pendente":        return {cls:"neu",  txt:"Ainda não sincronizado nesta sessão"};

  }
}
